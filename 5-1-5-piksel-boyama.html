<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piksel Boyama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{color-scheme:light;--lacivert:#1E3A8A;--turuncu:#EA580C;--mavi:#2563EB;--mavi-z:#DBEAFE;--yesil:#16A34A;--yesil-z:#DCFCE7;--kirmizi:#DC2626;--kirmizi-z:#FEE2E2;--mor:#7C3AED;--mor-z:#EDE9FE;--sari:#CA8A04;--sari-z:#FEF9C3;--pembe:#DB2777;--camgob:#0E7490;
  --metin:#1E293B;--soluk:#64748B;--cizgi:#CBD5E1;--f-baslik:"Baloo 2","Trebuchet MS",system-ui,sans-serif;--f-govde:"Nunito","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--metin);font-family:var(--f-govde);font-size:20px;padding:10px;-webkit-user-select:none;user-select:none;
  background:radial-gradient(circle at 6% 10%,#FDE68A 0 110px,transparent 111px),radial-gradient(circle at 94% 92%,#FBCFE8 0 150px,transparent 151px),radial-gradient(circle at 96% 8%,#BFDBFE 0 80px,transparent 81px),radial-gradient(circle at 4% 94%,#BBF7D0 0 100px,transparent 101px),linear-gradient(135deg,#EEF2FF,#FDF4FF 55%,#ECFEFF)}
h1,h2,h3{font-family:var(--f-baslik);margin:0;line-height:1.15}
.kap{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.ust{background:linear-gradient(90deg,#1E3A8A,#7C3AED 60%,#DB2777);color:#fff;border-radius:16px;padding:8px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;box-shadow:0 4px 14px rgba(124,58,237,.3)}
.ust h1{font-size:clamp(24px,2.8vw,36px);flex:1 1 280px}
.skor{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cip{border-radius:12px;padding:4px 16px;font-family:var(--f-baslik);font-size:clamp(20px,2vw,28px);background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.35);font-variant-numeric:tabular-nums}
.cip.a.sira{background:var(--turuncu);border-color:#fff}.cip.b.sira{background:var(--mor);border-color:#fff}
.kdugme{font:inherit;font-weight:800;font-size:16px;border:2px solid rgba(255,255,255,.45);background:transparent;color:#fff;border-radius:10px;padding:5px 12px;cursor:pointer}
.kutu{background:#fff;border-radius:24px;border:5px solid #C4B5FD;padding:20px 24px;box-shadow:0 4px 16px rgba(30,58,138,.1)}
.dugme{font-family:var(--f-baslik);font-weight:800;font-size:clamp(22px,2.1vw,30px);border:0;border-radius:16px;padding:12px 28px;cursor:pointer;background:var(--turuncu);color:#fff;box-shadow:0 5px 0 #9A3412}
.dugme:active{transform:translateY(2px);box-shadow:0 2px 0 #9A3412}
.dugme.lac{background:var(--lacivert);box-shadow:0 5px 0 #172554}.dugme.yes{background:var(--yesil);box-shadow:0 5px 0 #14532D}
.dugme.mor{background:var(--mor);box-shadow:0 5px 0 #4C1D95}.dugme.kir{background:var(--kirmizi);box-shadow:0 5px 0 #7F1D1D}.dugme.gri{background:#64748B;box-shadow:0 5px 0 #334155}
.dugme:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:5px solid var(--turuncu);outline-offset:3px}
.ekran{background:#fff;border:5px solid #C4B5FD;border-radius:26px;padding:24px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.ekran h2{font-size:clamp(32px,4.2vw,56px);color:var(--lacivert)}
.ekran p{margin:0;font-size:clamp(20px,2vw,26px);max-width:920px}
.etiket-s{font-weight:800;color:var(--soluk);font-size:18px;letter-spacing:.06em;text-transform:uppercase}
.secim{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.secim button{font:inherit;font-weight:800;font-size:21px;padding:10px 18px;border-radius:14px;border:3px solid var(--cizgi);background:#fff;color:var(--metin);cursor:pointer;min-width:160px}
.secim button[aria-pressed="true"]{border-color:var(--turuncu);background:#FFEDD5;color:#9A3412}
.secim small{display:block;font-weight:600;color:var(--soluk);font-size:15px}
.cevap{background:var(--yesil-z);border:4px solid var(--yesil);border-radius:16px;padding:12px 18px;font-size:clamp(24px,2.6vw,36px);font-weight:800;color:#14532D;animation:gel .35s ease-out}
.yanlis-k{background:var(--kirmizi-z);border:4px solid var(--kirmizi);border-radius:16px;padding:12px 18px;font-size:clamp(22px,2.3vw,32px);font-weight:800;color:#7F1D1D;animation:gel .35s ease-out}
@keyframes gel{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes salla{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.salla{animation:salla .4s}
.buyuk-ikon{font-size:72px;line-height:1}
.not{font-size:18px;color:var(--soluk)}
.hazirlayan{font-size:14px;color:#64748B;margin:4px 0 0}.hazirlayan b{color:#1E3A8A}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.galeri{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;width:100%}
.galeri button{font:inherit;border:5px solid var(--cizgi);border-radius:20px;background:#fff;padding:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:21px;color:var(--lacivert)}
.galeri button:hover{border-color:var(--mor)}
.galeri canvas{width:96px;height:96px;image-rendering:pixelated;border-radius:8px}
.alan{display:grid;grid-template-columns:auto minmax(240px,1fr);gap:16px;align-items:start}
.izgara{display:grid;gap:2px;background:#CBD5E1;border:6px solid #fff;border-radius:16px;box-shadow:0 6px 18px rgba(0,0,0,.15);touch-action:none;user-select:none}
.px{display:grid;place-items:center;font-family:var(--f-baslik);font-weight:800;color:#475569;background:#fff;cursor:pointer;line-height:1}
.px.boyali{color:transparent}
.px.hata{animation:kirmizi .5s}
@keyframes kirmizi{0%,100%{box-shadow:none}50%{box-shadow:inset 0 0 0 5px #EF4444}}
.yan{display:flex;flex-direction:column;gap:12px}
.palet{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;background:#fff;border:5px solid #C4B5FD;border-radius:22px;padding:12px}
.renk{font:inherit;font-family:var(--f-baslik);font-weight:800;font-size:30px;height:74px;border-radius:16px;border:5px solid rgba(0,0,0,.12);cursor:pointer;display:grid;place-items:center;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.5)}
.renk.secili{outline:6px solid var(--lacivert);outline-offset:3px}
.renk.bitti{opacity:.4}
.kod{background:#0F172A;color:#A7F3D0;border-radius:18px;padding:12px 16px;font-family:ui-monospace,Menlo,monospace;font-size:clamp(14px,1.2vw,17px);max-height:40vh;overflow:auto;line-height:1.5;white-space:pre-wrap}
.bilgi-k{background:var(--sari-z);border:4px solid var(--sari);border-radius:16px;padding:10px 14px;font-weight:700;font-size:clamp(18px,1.7vw,23px)}
@media (max-width:900px){.alan{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="kap">
  <header class="ust"><h1>Piksel Boyama</h1><div class="skor" id="skor"></div><span id="sesyer"></span></header>
  <main id="sahne"></main>
</div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const el=(t,o={},...c)=>{const e=document.createElement(t);Object.entries(o).forEach(([k,v])=>v==null||v===false?0:k==='class'?e.className=v:k==='html'?e.innerHTML=v:k.startsWith('on')?e[k]=v:e.setAttribute(k,v));c.flat().forEach(x=>x!=null&&x!==false&&e.append(x));return e};
const md=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
const karistir=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let SES=true,AC=null;
function bip(f,t=.15,tip='triangle'){if(!SES)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=tip;o.frequency.value=f;g.gain.setValueAtTime(.2,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+t)}catch(e){}}
const dogruSes=()=>{bip(784,.12);setTimeout(()=>bip(1047,.2),110)}, yanlisSes=()=>{bip(220,.25,'sawtooth')};
const IMZA=()=>el('p',{class:'hazirlayan'},el('b',{},'Hazırlayan: Ayşegül SARIKOZ (BTY Dersi Öğretmeni)'),' · Türkkonut Ortaokulu');
function sesDugmesi(){const b=el('button',{class:'kdugme','aria-pressed':'true'},'Ses: açık');b.onclick=()=>{SES=!SES;b.textContent='Ses: '+(SES?'açık':'kapalı');b.setAttribute('aria-pressed',String(SES))};return b}
function secimGrubu(secenekler,deger,degis){const g=el('div',{class:'secim'});const yen=()=>g.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===String(deger()))));
  secenekler.forEach(([v,ad,alt])=>g.append(el('button',{'data-v':v,onclick:()=>{degis(v);yen()}},ad,alt?el('small',{},alt):null)));yen();return g}

$('#sesyer').append(sesDugmesi());
const sahne=$('#sahne');
const RESIM=[
 {ad:'Robot',arka:'#E0F2FE',renk:['#EF4444','#94A3B8','#38BDF8','#1E293B','#8B5CF6'],p:[
  '.....11.....','.....11.....','..22222222..','..23322332..','..23322332..','..22222222..','..22444422..','..22222222..','....5555....','..55555555..','..55.55.55..','..55.55.55..']},
 {ad:'Bilgisayar',arka:'#FEF9C3',renk:['#1E293B','#38BDF8','#FFFFFF','#64748B'],p:[
  '............','.1111111111.','.1222222221.','.1233322221.','.1222222221.','.1222333221.','.1222222221.','.1111111111.','.....44.....','.....44.....','...444444...','............']},
 {ad:'Fare',arka:'#DCFCE7',renk:['#E2E8F0','#F97316','#475569'],p:[
  '.....33.....','.....3......','...11211....','..1112111...','..1112111...','..11111111..','..11111111..','..11111111..','..11111111..','...111111...','....1111....','............']},
 {ad:'Kedi',arka:'#EDE9FE',renk:['#FB923C','#16A34A','#F472B6'],p:[
  '.1........1.','.11......11.','.1111111111.','.1121111211.','.1121111211.','.1111331111.','.1111111111.','..11111111..','...111111...','..11111111..','.1111111111.','.1111111111.']},
 {ad:'Roket',arka:'#1E3A8A',renk:['#EF4444','#F1F5F9','#38BDF8','#F97316','#FACC15'],p:[
  '.....11.....','....1111....','....2222....','...222222...','...223322...','...223322...','...222222...','...222222...','..42222224..','.4422222244.','.44.5555.44.','.....55.....']}
];
const SERBEST=['#FFFFFF','#1E293B','#EF4444','#F97316','#FACC15','#22C55E','#38BDF8','#2563EB','#8B5CF6','#F472B6','#92400E','#94A3B8'];
const RAD=['beyaz','siyah','kırmızı','turuncu','sarı','yeşil','açık mavi','mavi','mor','pembe','kahverengi','gri'];
let D=null;
function minik(r){const c=el('canvas',{width:12,height:12});const x=c.getContext('2d');r.p.forEach((s,y)=>[...s].forEach((ch,i)=>{x.fillStyle=ch==='.'?r.arka:r.renk[+ch-1];x.fillRect(i,y,1,1)}));return c;}
function skorCiz(){const k=$('#skor');k.innerHTML='';if(!D)return;if(D.r)k.append(el('span',{class:'cip'},`Boyanan: ${D.boy} / ${D.top}`));k.append(el('button',{class:'kdugme',onclick:giris},'Resimler'));}
function giris(){D=null;skorCiz();sahne.innerHTML='';
  sahne.append(el('section',{class:'ekran'},el('h2',{},'Piksel Boyama'),el('p',{html:md('Ekrandaki her resim **piksel** denen küçük karelerden oluşur. Bir renk seç ve aynı numaralı kareleri boya. Parmağını sürükleyerek de boyayabilirsin!')}),
    el('div',{class:'galeri'},RESIM.map((r,i)=>el('button',{onclick:()=>boya(i)},minik(r),r.ad)),el('button',{onclick:serbest,style:'border-color:var(--turuncu)'},el('div',{style:'width:96px;height:96px;display:grid;place-items:center;font-size:58px;background:conic-gradient(#EF4444,#FACC15,#22C55E,#38BDF8,#8B5CF6,#EF4444);border-radius:8px;color:#fff;font-family:var(--f-baslik)'},'+'),'Kendi resmin')),IMZA()));}
function izgara(N,hucre){const boy=Math.floor((innerHeight-150)/N)-2;const g=el('div',{class:'izgara',style:`grid-template-columns:repeat(${N},${boy}px);grid-auto-rows:${boy}px`});
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const c=el('div',{class:'px','data-x':x,'data-y':y,style:`font-size:${boy*.5}px`});hucre(c,x,y);g.append(c)}
  let basili=false;g.onpointerdown=e=>{basili=true;const t=e.target.closest('.px');t&&D.tik(t);e.preventDefault()};
  g.onpointermove=e=>{if(!basili)return;const t=document.elementFromPoint(e.clientX,e.clientY);const p=t&&t.closest('.px');p&&D.tik(p)};
  addEventListener('pointerup',()=>basili=false);return g;}
function boya(ri){const r=RESIM[ri];let top=0;r.p.forEach(s=>[...s].forEach(c=>{if(c!=='.')top++}));D={r,sec:1,boy:0,top,hataSay:0};skorCiz();sahne.innerHTML='';
  const g=izgara(12,(c,x,y)=>{const ch=r.p[y][x];if(ch==='.'){c.style.background=r.arka;c.classList.add('boyali');c.dataset.n=0}else{c.textContent=ch;c.dataset.n=ch}});
  const palet=el('div',{class:'palet'},r.renk.map((rk,i)=>el('button',{class:'renk'+(i===0?' secili':''),'data-n':i+1,style:`background:${rk}`,onclick:e=>{D.sec=i+1;$$('.renk').forEach(b=>b.classList.remove('secili'));e.currentTarget.classList.add('secili')}},String(i+1))));
  const bilgi=el('div',{class:'bilgi-k'},'Renk seç, sonra o numaralı kareleri boya.');
  sahne.append(el('div',{class:'alan'},g,el('div',{class:'yan'},el('h2',{style:'margin:0;font-family:var(--f-baslik);font-size:36px;color:var(--lacivert)'},r.ad),palet,bilgi)));
  D.tik=c=>{if(c.classList.contains('boyali'))return;if(+c.dataset.n!==D.sec){if(!c.classList.contains('hata')){c.classList.add('hata');setTimeout(()=>c.classList.remove('hata'),500);D.hataSay++;bip(200,.06,'square')}return}
    c.style.background=r.renk[D.sec-1];c.classList.add('boyali');D.boy++;bip(500+D.boy*6,.04);skorCiz();
    if(![...$$('.px')].some(p=>!p.classList.contains('boyali')&&+p.dataset.n===D.sec))$(`.renk[data-n="${D.sec}"]`).classList.add('bitti');
    if(D.boy===D.top){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>bip(f,.2),i*130));$('.izgara').style.gap='0';$$('.px').forEach(p=>p.style.borderRadius='0');
      bilgi.innerHTML=`<strong>Tamamlandı!</strong> Bu resim 12 × 12 = <strong>144 pikselden</strong> oluşuyor. Telefon ekranlarında ise milyonlarca piksel vardır. Bilgisayar her pikselin rengini bir sayı olarak saklar.`;
      bilgi.after(el('div',{style:'display:flex;gap:10px;flex-wrap:wrap'},el('button',{class:'dugme',onclick:giris},'Başka resim'),el('button',{class:'dugme lac',onclick:()=>boya(ri)},'Tekrar')));}};}
function serbest(){const N=12;const veri=Array.from({length:N},()=>Array(N).fill(0));D={sec:2,veri};skorCiz();sahne.innerHTML='';
  const kod=el('div',{class:'kod'});
  const yaz=()=>{kod.textContent=veri.map((s,y)=>{const p=[];let n=1;for(let i=1;i<=N;i++){if(i<N&&s[i]===s[i-1])n++;else{p.push(n+' '+RAD[s[i-1]]);n=1}}return `Satır ${String(y+1).padStart(2)}: `+p.join(', ')}).join('\n')};
  const g=izgara(N,(c,x,y)=>{c.style.background=SERBEST[0]});
  const palet=el('div',{class:'palet',style:'grid-template-columns:repeat(6,1fr)'},SERBEST.map((rk,i)=>el('button',{class:'renk'+(i===D.sec?' secili':''),title:RAD[i],style:`background:${rk};height:54px`,onclick:e=>{D.sec=i;$$('.renk').forEach(b=>b.classList.remove('secili'));e.currentTarget.classList.add('secili')}})));
  D.tik=c=>{const x=+c.dataset.x,y=+c.dataset.y;if(veri[y][x]===D.sec)return;veri[y][x]=D.sec;c.style.background=SERBEST[D.sec];yaz()};yaz();
  sahne.append(el('div',{class:'alan'},g,el('div',{class:'yan'},el('h2',{style:'margin:0;font-family:var(--f-baslik);font-size:32px;color:var(--lacivert)'},'Kendi resmini çiz'),palet,
    el('div',{class:'bilgi-k',style:'font-size:18px'},'Aşağıda resminin “kodu” var. Bilgisayar da resimleri böyle sayılarla saklar. Kodu arkadaşına oku, o da aynı resmi çizsin!'),kod,
    el('button',{class:'dugme gri',style:'font-size:20px;padding:8px 16px;align-self:flex-start',onclick:serbest},'Temizle'))));}
giris();
</script>
</body>
</html>

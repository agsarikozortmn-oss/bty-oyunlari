<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robotik Kodlama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{color-scheme:light;--lacivert:#1E3A8A;--turuncu:#EA580C;--mavi:#2563EB;--mavi-z:#DBEAFE;--yesil:#16A34A;--yesil-z:#DCFCE7;--kirmizi:#DC2626;--kirmizi-z:#FEE2E2;--mor:#7C3AED;--mor-z:#EDE9FE;--sari:#CA8A04;--sari-z:#FEF9C3;--pembe:#DB2777;--camgob:#0E7490;
  --metin:#1E293B;--soluk:#64748B;--cizgi:#CBD5E1;--f-baslik:"Baloo 2","Trebuchet MS",system-ui,sans-serif;--f-govde:"Nunito","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--metin);font-family:var(--f-govde);font-size:20px;padding:10px;-webkit-user-select:none;user-select:none;
  background:radial-gradient(circle at 6% 10%,#FDE68A 0 110px,transparent 111px),radial-gradient(circle at 94% 92%,#FBCFE8 0 150px,transparent 151px),radial-gradient(circle at 96% 8%,#BFDBFE 0 80px,transparent 81px),radial-gradient(circle at 4% 94%,#BBF7D0 0 100px,transparent 101px),linear-gradient(135deg,#EEF2FF,#FDF4FF 55%,#ECFEFF)}
h1,h2,h3{font-family:var(--f-baslik);margin:0;line-height:1.15}
.kap{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.ust{background:linear-gradient(90deg,#1E3A8A,#7C3AED 60%,#DB2777);color:#fff;border-radius:16px;padding:8px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;box-shadow:0 4px 14px rgba(124,58,237,.3)}
.ust h1{font-size:clamp(24px,2.8vw,36px);flex:1 1 280px}
.skor{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cip{border-radius:12px;padding:4px 16px;font-family:var(--f-baslik);font-size:clamp(20px,2vw,28px);background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.35);font-variant-numeric:tabular-nums}
.cip.a.sira{background:var(--turuncu);border-color:#fff}.cip.b.sira{background:var(--mor);border-color:#fff}
.kdugme{font:inherit;font-weight:800;font-size:16px;border:2px solid rgba(255,255,255,.45);background:transparent;color:#fff;border-radius:10px;padding:5px 12px;cursor:pointer}
.kutu{background:#fff;border-radius:24px;border:5px solid #C4B5FD;padding:20px 24px;box-shadow:0 4px 16px rgba(30,58,138,.1)}
.dugme{font-family:var(--f-baslik);font-weight:800;font-size:clamp(22px,2.1vw,30px);border:0;border-radius:16px;padding:12px 28px;cursor:pointer;background:var(--turuncu);color:#fff;box-shadow:0 5px 0 #9A3412}
.dugme:active{transform:translateY(2px);box-shadow:0 2px 0 #9A3412}
.dugme.lac{background:var(--lacivert);box-shadow:0 5px 0 #172554}.dugme.yes{background:var(--yesil);box-shadow:0 5px 0 #14532D}
.dugme.mor{background:var(--mor);box-shadow:0 5px 0 #4C1D95}.dugme.kir{background:var(--kirmizi);box-shadow:0 5px 0 #7F1D1D}.dugme.gri{background:#64748B;box-shadow:0 5px 0 #334155}
.dugme:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:5px solid var(--turuncu);outline-offset:3px}
.ekran{background:#fff;border:5px solid #C4B5FD;border-radius:26px;padding:24px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.ekran h2{font-size:clamp(32px,4.2vw,56px);color:var(--lacivert)}
.ekran p{margin:0;font-size:clamp(20px,2vw,26px);max-width:920px}
.etiket-s{font-weight:800;color:var(--soluk);font-size:18px;letter-spacing:.06em;text-transform:uppercase}
.secim{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.secim button{font:inherit;font-weight:800;font-size:21px;padding:10px 18px;border-radius:14px;border:3px solid var(--cizgi);background:#fff;color:var(--metin);cursor:pointer;min-width:160px}
.secim button[aria-pressed="true"]{border-color:var(--turuncu);background:#FFEDD5;color:#9A3412}
.secim small{display:block;font-weight:600;color:var(--soluk);font-size:15px}
.cevap{background:var(--yesil-z);border:4px solid var(--yesil);border-radius:16px;padding:12px 18px;font-size:clamp(24px,2.6vw,36px);font-weight:800;color:#14532D;animation:gel .35s ease-out}
.yanlis-k{background:var(--kirmizi-z);border:4px solid var(--kirmizi);border-radius:16px;padding:12px 18px;font-size:clamp(22px,2.3vw,32px);font-weight:800;color:#7F1D1D;animation:gel .35s ease-out}
@keyframes gel{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes salla{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.salla{animation:salla .4s}
.buyuk-ikon{font-size:72px;line-height:1}
.not{font-size:18px;color:var(--soluk)}
.hazirlayan{font-size:14px;color:#64748B;margin:4px 0 0}.hazirlayan b{color:#1E3A8A}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.ust{background:linear-gradient(90deg,#0F766E,#0E7490 45%,#1E3A8A)}
.giris-ust{display:flex;gap:20px;align-items:center;justify-content:center;flex-wrap:wrap}
.giris-ust img{width:130px;height:130px}
.konular{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;width:100%}
.konular button{font:inherit;font-family:var(--f-baslik);font-size:22px;color:#fff;border:0;border-radius:20px;padding:14px 16px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.22);text-align:left;line-height:1.15}
.konular button small{display:block;font-family:var(--f-govde);font-size:15px;font-weight:700;opacity:.92;margin-top:4px}
.konular button:hover{transform:translateY(-3px)}
.konular button.hepsi{grid-column:1/-1;text-align:center;font-size:26px;background:linear-gradient(90deg,#0F766E,#1E3A8A)}
.oyun{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:14px;align-items:start}
.kart{background:#fff;border:5px solid #99F6E4;border-radius:24px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.soru-ust{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rozet{font-weight:800;font-size:15px;border-radius:999px;padding:3px 12px;color:#fff}
.soru-metni{font-family:var(--f-baslik);font-size:clamp(24px,2.4vw,34px);color:var(--lacivert);line-height:1.2;text-wrap:balance}
.govde{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:center}
.govde.tek{grid-template-columns:1fr}
.gorsel{background:#F8FAFC;background-image:radial-gradient(#CBD5E1 1.2px,transparent 1.3px);background-size:22px 22px;border:3px solid #E2E8F0;border-radius:18px;padding:12px;display:flex;align-items:center;justify-content:center;min-height:240px;overflow:auto}
.gorsel svg,.gorsel img{max-width:100%;height:auto;max-height:52vh;display:block}
svg.blok text{font-weight:400!important;font-family:Arial,Helvetica,sans-serif}
.gorsel img.foto{border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.15);background:#fff}
.siklar{display:grid;grid-template-columns:1fr;gap:10px}
.siklar.resimli{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.siklar.iki{grid-template-columns:1fr 1fr}
.sik{font:inherit;font-weight:800;font-size:clamp(20px,1.9vw,26px);border:4px solid var(--cizgi);background:#fff;border-radius:16px;padding:10px 14px;cursor:pointer;color:var(--metin);text-align:left;display:flex;gap:12px;align-items:center}
.sik .h{flex:0 0 40px;height:40px;border-radius:50%;background:#E0F2FE;color:#075985;display:grid;place-items:center;font-family:var(--f-baslik)}
.siklar.resimli .sik{flex-direction:column;text-align:center;padding:10px}
.siklar.resimli .sik img,.siklar.resimli .sik svg{max-width:100%;height:120px;object-fit:contain}
.sik:hover:not(:disabled){border-color:#0E7490;background:#ECFEFF}
.sik.dogru{background:var(--yesil-z);border-color:var(--yesil);color:#14532D}.sik.dogru .h{background:var(--yesil);color:#fff}
.sik.yanlis{background:var(--kirmizi-z);border-color:var(--kirmizi)}.sik.yanlis .h{background:var(--kirmizi);color:#fff}
.sik:disabled{cursor:default}
.dy{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dy .sik{justify-content:center;font-family:var(--f-baslik);font-size:clamp(28px,3vw,40px)}
[data-k]{cursor:pointer;transition:filter .15s}
[data-k]:hover{filter:drop-shadow(0 0 6px #F59E0B)}
.tik-dogru{filter:drop-shadow(0 0 7px #16A34A) drop-shadow(0 0 3px #16A34A)!important}
.tik-yanlis{filter:drop-shadow(0 0 7px #DC2626) drop-shadow(0 0 3px #DC2626)!important}
.tik-ipucu{font-weight:800;color:#0E7490;font-size:19px}
.sira-alan{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sira-kutu{background:#F8FAFC;border:3px dashed #94A3B8;border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.sira-kutu h4{margin:0;font-family:var(--f-baslik);font-size:20px;color:var(--soluk)}
.parca{font:inherit;font-weight:800;font-size:clamp(18px,1.7vw,23px);background:#fff;border:3px solid #CBD5E1;border-radius:14px;padding:8px 12px;cursor:pointer;display:flex;gap:10px;align-items:center;text-align:left;color:var(--metin)}
.parca svg,.parca img{max-width:100%;height:auto;max-height:110px}
.parca .no{flex:0 0 34px;height:34px;border-radius:50%;background:#0E7490;color:#fff;display:grid;place-items:center;font-family:var(--f-baslik)}
.parca.dogru{border-color:var(--yesil);background:var(--yesil-z)}.parca.yanlis{border-color:var(--kirmizi);background:var(--kirmizi-z)}
.grup-kartlar{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.gk{background:#fff;border:3px solid #CBD5E1;border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;font-weight:800;font-size:clamp(17px,1.6vw,21px)}
.gk img,.gk svg{max-width:100%;height:90px;object-fit:contain}
.gk .bt{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.gk .bt button{font:inherit;font-size:15px;font-weight:800;border:2px solid var(--cizgi);background:#F8FAFC;border-radius:10px;padding:4px 10px;cursor:pointer}
.gk .bt button[aria-pressed="true"]{color:#fff;border-color:transparent}
.gk.dogru{border-color:var(--yesil);background:var(--yesil-z)}.gk.yanlis{border-color:var(--kirmizi);background:var(--kirmizi-z)}
.aciklama-k{border-radius:16px;padding:12px 16px;font-size:clamp(19px,1.8vw,24px);font-weight:700;animation:gel .3s ease-out}
.aciklama-k.ok{background:var(--yesil-z);border:3px solid var(--yesil);color:#14532D}
.aciklama-k.no{background:var(--kirmizi-z);border:3px solid var(--kirmizi);color:#7F1D1D}
.alt-dugmeler{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.yan{display:flex;flex-direction:column;gap:10px;position:sticky;top:10px}
.robot-k{background:#fff;border:5px solid #99F6E4;border-radius:22px;padding:10px;text-align:center}
.robot-k h4{margin:0 0 4px;font-family:var(--f-baslik);font-size:22px;color:#0F766E}
.robot-k.sira{border-color:var(--turuncu);box-shadow:0 0 0 4px #FED7AA}
.robot-k .puan{font-family:var(--f-baslik);font-size:30px;color:var(--lacivert)}
.robot svg{width:100%;height:auto;max-height:260px}
.robot .p{transition:fill .4s,stroke .4s}
.robot .p.yok,.robot .p.yok *{fill:#F1F5F9!important;stroke:#CBD5E1!important;stroke-dasharray:5 4}
.robot .p.yeni{animation:parla .8s ease-out}
@keyframes parla{0%{opacity:0;transform:scale(1.3)}100%{opacity:1;transform:none}}
.robot .p{transform-box:fill-box;transform-origin:center}
.ilerleme{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.ilerleme i{width:16px;height:16px;border-radius:50%;background:#E2E8F0}.ilerleme i.d{background:var(--yesil)}.ilerleme i.y{background:var(--kirmizi)}.ilerleme i.s{background:var(--turuncu)}
.sonuc-liste{display:flex;flex-direction:column;gap:8px;width:100%;max-width:1000px;text-align:left}
.sonuc-liste div{border-radius:12px;padding:8px 14px;background:#FEF2F2;border-left:6px solid var(--kirmizi);font-size:18px}
.kaynakca{font-size:13px;color:var(--soluk);max-width:1000px}
@media (max-width:1000px){.oyun{grid-template-columns:1fr}.yan{position:static;flex-direction:row}.robot-k{flex:1}.govde{grid-template-columns:1fr}.sira-alan{grid-template-columns:1fr}}
</style>
</head>

  <main id="sahne"></main>
</div>

let SES=true,AC=null;
function bip(f,t=.15,tip='triangle'){if(!SES)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=tip;o.frequency.value=f;g.gain.setValueAtTime(.2,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+t)}catch(e){}}
const dogruSes=()=>{bip(784,.12);setTimeout(()=>bip(1047,.2),110)}, yanlisSes=()=>{bip(220,.25,'sawtooth')};
const IMZA=()=>el('p',{class:'hazirlayan'},el('b',{},'Hazırlayan: Ayşegül SARIKOZ (BTY Dersi Öğretmeni)'),' · Türkkonut Ortaokulu');
function sesDugmesi(){const b=el('button',{class:'kdugme','aria-pressed':'true'},'Ses: açık');b.onclick=()=>{SES=!SES;b.textContent='Ses: '+(SES?'açık':'kapalı');b.setAttribute('aria-pressed',String(SES))};return b}
function secimGrubu(secenekler,deger,degis){const g=el('div',{class:'secim'});const yen=()=>g.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===String(deger()))));

  kart.append(el('div',{class:'tik-ipucu'},'Görselde doğru yere tıkla.'),g);}
function siraCiz(S,kart,alt){const dizi=[],kutuA=el('div',{class:'sira-kutu'},el('h4',{},'Parçalar (sırayla dokun)')),kutuB=el('div',{class:'sira-kutu'},el('h4',{},S.baslikB||'Senin sıran'));

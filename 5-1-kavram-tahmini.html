<html lang="tr">

<style>
:root{color-scheme:light;--lacivert:#1E3A8A;--turuncu:#EA580C;--mavi:#2563EB;--mavi-z:#DBEAFE;--yesil:#16A34A;--yesil-z:#DCFCE7;--kirmizi:#DC2626;--kirmizi-z:#FEE2E2;--mor:#7C3AED;--mor-z:#EDE9FE;--sari:#CA8A04;--sari-z:#FEF9C3;--pembe:#DB2777;--camgob:#0E7490;

body{margin:0;min-height:100vh;color:var(--metin);font-family:var(--f-govde);font-size:20px;padding:10px;-webkit-user-select:none;user-select:none;

h1,h2,h3{font-family:var(--f-baslik);margin:0;line-height:1.15}
.kap{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.ust{background:linear-gradient(90deg,#1E3A8A,#7C3AED 60%,#DB2777);color:#fff;border-radius:16px;padding:8px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;box-shadow:0 4px 14px rgba(124,58,237,.3)}

.skor{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.not{font-size:18px;color:var(--soluk)}

.kelime{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}

.kutuh.kayip{color:var(--kirmizi)}
.klavye{display:flex;flex-direction:column;gap:7px;align-items:center}
.klavye div{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.tus{font:inherit;font-family:var(--f-baslik);font-weight:800;font-size:clamp(26px,2.7vw,38px);width:clamp(46px,4.6vw,66px);height:clamp(50px,5vw,70px);border-radius:14px;border:0;background:var(--lacivert);color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.tus:hover:not(:disabled){transform:translateY(-2px)}
.tus.var{background:var(--yesil)}.tus.yok{background:#CBD5E1;color:#94A3B8;box-shadow:none}

.sonuc{display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;animation:gel .3s}
.sonuc h3{margin:0;font-family:var(--f-baslik);font-size:clamp(34px,4vw,56px)}
@media (max-width:900px){.oyun{grid-template-columns:1fr}}
</style>
</head>

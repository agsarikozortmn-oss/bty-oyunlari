<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bilgi Çarkı · 5. Sınıf 1. Tema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Akıllı tahta için tek ekranlık çark oyunu. Ders notlarıyla aynı renkler; bilinçli olarak tek (açık) tema. */
:root{color-scheme:light;
  --lacivert:#1E3A8A;--turuncu:#EA580C;--mavi:#2563EB;--mavi-z:#DBEAFE;--yesil:#16A34A;--yesil-z:#DCFCE7;--kirmizi:#DC2626;--kirmizi-z:#FEE2E2;
  --mor:#7C3AED;--mor-z:#EDE9FE;--sari:#CA8A04;--sari-z:#FEF9C3;--metin:#1E293B;--soluk:#64748B;--cizgi:#CBD5E1;--zemin:#EEF2FF;
  --f-baslik:"Baloo 2","Trebuchet MS",system-ui,sans-serif;--f-govde:"Nunito","Segoe UI",system-ui,sans-serif;
  --d:min(calc(100vh - 130px),46vw)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 8% 12%,#FDE68A 0 120px,transparent 121px),radial-gradient(circle at 92% 88%,#FBCFE8 0 160px,transparent 161px),radial-gradient(circle at 95% 10%,#BFDBFE 0 90px,transparent 91px),radial-gradient(circle at 4% 92%,#BBF7D0 0 110px,transparent 111px),linear-gradient(135deg,#EEF2FF,#FDF4FF 55%,#ECFEFF);color:var(--metin);font-family:var(--f-govde);font-size:17px;padding:10px;-webkit-user-select:none;user-select:none}
h1,h2,h3{font-family:var(--f-baslik);margin:0;line-height:1.15}
.kap{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.ust{background:linear-gradient(90deg,#1E3A8A,#7C3AED 60%,#DB2777);box-shadow:0 4px 14px rgba(124,58,237,.3);color:#fff;border-radius:14px;padding:8px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.ust h1{font-size:clamp(24px,2.8vw,36px);flex:1 1 260px}
.skor{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.takim{border-radius:12px;padding:4px 16px;font-family:var(--f-baslik);font-size:clamp(20px,2vw,28px);background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.3);font-variant-numeric:tabular-nums}
.takim.sira.a{background:var(--turuncu);border-color:#fff}.takim.sira.b{background:var(--mor);border-color:#fff}
.kucuk-dugme{font:inherit;font-weight:800;font-size:14px;border:2px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:10px;padding:4px 10px;cursor:pointer}
.sahne{display:grid;grid-template-columns:var(--d) minmax(0,1fr);gap:16px;align-items:center}
.cark-kap{position:relative;width:var(--d);height:var(--d)}
#cark{width:100%;height:100%;display:block;border-radius:50%;box-shadow:0 8px 28px rgba(30,58,138,.28);transition:transform 4.3s cubic-bezier(.12,.82,.18,1)}
.ok{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-top:44px solid var(--lacivert);filter:drop-shadow(0 3px 2px rgba(0,0,0,.25));z-index:2}
.cevir{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:24%;height:24%;border-radius:50%;border:6px solid #fff;background:var(--lacivert);color:#fff;font-family:var(--f-baslik);font-weight:800;font-size:clamp(16px,2vw,28px);cursor:pointer;box-shadow:0 4px 0 #172554,0 6px 18px rgba(0,0,0,.25)}
.cevir:active{transform:translate(-50%,-48%)}
.cevir:disabled{opacity:.6;cursor:default}
.cevir:focus-visible,.dugme:focus-visible,.secim button:focus-visible{outline:4px solid var(--turuncu);outline-offset:3px}
.panel{background:#fff;border-radius:24px;padding:24px 28px;border:5px solid #C4B5FD;min-height:calc(var(--d) * .75);display:flex;flex-direction:column;gap:14px;justify-content:center;box-shadow:0 4px 16px rgba(30,58,138,.1)}
.rozet{align-self:flex-start;color:#fff;border-radius:999px;padding:6px 20px;font-weight:800;font-size:clamp(18px,1.8vw,24px)}
.soru{font-family:var(--f-baslik);font-size:clamp(28px,3.4vw,50px);font-weight:700;color:var(--lacivert);line-height:1.25}
.secenek{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.secenek div{border:4px solid var(--cizgi);border-radius:16px;padding:12px 16px;font-weight:800;font-size:clamp(22px,2.2vw,32px);background:#F8FAFC;display:flex;gap:10px;align-items:center}
.secenek b{display:grid;place-items:center;min-width:46px;height:46px;font-size:.9em;border-radius:50%;background:var(--lacivert);color:#fff;font-family:var(--f-baslik)}
.secenek div.dogru{border-color:var(--yesil);background:var(--yesil-z)}
.secenek div.dogru b{background:var(--yesil)}
.cevap{background:var(--yesil-z);border:4px solid var(--yesil);border-radius:16px;padding:14px 20px;font-size:clamp(26px,2.8vw,40px);font-weight:800;color:#14532D;animation:gel .35s ease-out}
@keyframes gel{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.dugmeler{display:flex;gap:10px;flex-wrap:wrap}
.dugme{font-family:var(--f-baslik);font-weight:800;font-size:clamp(22px,2vw,28px);border:0;border-radius:16px;padding:12px 26px;cursor:pointer;background:var(--turuncu);color:#fff;box-shadow:0 4px 0 #9A3412}
.dugme:active{transform:translateY(2px);box-shadow:0 2px 0 #9A3412}
.dugme.lac{background:var(--lacivert);box-shadow:0 4px 0 #172554}
.dugme.yes{background:var(--yesil);box-shadow:0 4px 0 #14532D}
.dugme.mor{background:var(--mor);box-shadow:0 4px 0 #4C1D95}
.dugme.gri{background:#64748B;box-shadow:0 4px 0 #334155}
.bekle{text-align:center;color:var(--soluk);font-size:clamp(24px,2.4vw,34px);font-weight:800}
.bekle .buyuk{font-family:var(--f-baslik);font-size:clamp(36px,4.2vw,60px);color:var(--lacivert);display:block}
.numara{font-family:var(--f-baslik);font-size:clamp(90px,14vw,200px);font-weight:800;line-height:1;text-align:center;animation:gel .35s ease-out}
.cikanlar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.cikanlar span{background:var(--mavi-z);color:var(--lacivert);border-radius:10px;padding:3px 12px;font-weight:800;font-size:22px}
.not{font-size:18px;color:var(--soluk)}
.ekran{background:#fff;border:5px solid #C4B5FD;border-radius:26px;padding:24px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.ekran h2{font-size:clamp(28px,4vw,44px);color:var(--lacivert)}
.ekran p{margin:0;font-size:22px;max-width:720px}
.etiket-s{font-weight:800;color:var(--soluk);font-size:18px;letter-spacing:.06em;text-transform:uppercase}
.secim{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:980px}
.secim button{font:inherit;font-weight:800;font-size:21px;padding:10px 16px;border-radius:14px;border:3px solid var(--cizgi);background:#fff;color:var(--metin);cursor:pointer;min-width:150px}
.secim button[aria-pressed="true"]{border-color:var(--turuncu);background:#FFEDD5;color:#9A3412}
.secim small{display:block;font-weight:600;color:var(--soluk);font-size:15px}
.secim.konu button[aria-pressed="true"]{color:#fff;border-color:transparent}
.ekran input{font-size:22px;padding:8px 12px;border-radius:12px;border:3px solid var(--cizgi);width:110px;text-align:center;font-family:var(--f-govde);-webkit-user-select:text;user-select:text}
.hazirlayan{font-size:13px;color:#64748B;margin:4px 0 0}.hazirlayan b{color:#1E3A8A}
.kazanan{font-size:56px}
@media (max-width:820px){:root{--d:88vw}.sahne{grid-template-columns:1fr;justify-items:center}.panel{width:100%;min-height:0}.secenek{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){#cark{transition-duration:.6s}.cevap,.numara{animation:none}}
</style>
</head>
<body>
<div class="kap">
  <header class="ust">
    <h1>Bilgi Çarkı · 5. Sınıf 1. Tema</h1>
    <div class="skor" id="skor"></div>
    <button class="kucuk-dugme" id="ses" aria-pressed="true">🔊 Ses</button>
  </header>
  <main id="sahne"></main>
</div>
<script>
const KONULAR=[
 {ad:'Sınıflandırma',uzun:'Bilişim Teknolojilerinin Sınıflandırılması',renk:'#2563EB'},
 {ad:'Dijital Sağlık',uzun:'Bilişim Teknolojilerinin Etkileri ve Dijital Sağlık',renk:'#DB2777'},
 {ad:'Dijital Vatandaşlık',uzun:'Dijital Vatandaşlık Uygulamaları',renk:'#16A34A'},
 {ad:'Yapay Zekâ',uzun:'Yapay Zekâda Temel Kavram ve Özellikler',renk:'#EA580C'},
 {ad:'Bilgisayar Sistemleri',uzun:'Bilgisayar Sistemlerinin Kullanımı',renk:'#7C3AED'},
 {ad:'Dosya ve Klasör',uzun:'Dosya ve Klasör Yönetimi',renk:'#0E7490'}];
// s: soru · c: seçenekler (varsa) · a: doğru seçenek sırası ya da cevap metni
const SORULAR=[
[{s:'Tek başına anlam taşımayan ham sayı, harf ve sembollere ne denir?',a:'Veri'},
 {s:'Hangisi bir yazılımdır?',c:['Yazıcı','Web tarayıcısı','Monitör','Kulaklık'],a:1},
 {s:'Bilgisayarın elle dokunabildiğimiz parçalarına ne denir?',a:'Donanım'},
 {s:'Daktilonun günümüzdeki karşılığı nedir?',a:'Bilgisayar ve kelime işlemci programı'},
 {s:'Disketin yerini bugün hangi teknolojiler aldı?',a:'Bulut depolama ve USB bellek'},
 {s:'Doktorların röntgen görüntülerini bilgisayarda incelemesi hangi alana örnektir?',c:['Eğlence','Sağlık','Ulaşım','Bankacılık'],a:1},
 {s:'Yeşil ekran önünde çekim yapan oyuncu neden yeşil kıyafet giymemelidir?',a:'Yazılım yeşil rengi siler. Kıyafet de silinir, oyuncu görünmez olur!'},
 {s:'Bilişim teknolojilerinin dört avantajını söyle.',a:'Kolaylık, hız, tasarruf, verimlilik'},
 {s:'Navigasyonla okula giden en kısa yolu bulmak hangi alana örnektir?',c:['Ulaşım','Eğitim','Sağlık','Sanat'],a:0},
 {s:'İlk bilgisayarlardan ENIAC yaklaşık kaç ton ağırlığındaydı?',a:'Yaklaşık 27 ton'},
 {s:'BİT kısaltmasının açılımı nedir?',a:'Bilgi ve İletişim Teknolojileri'}],
[{s:'20-20-20 kuralını açıkla.',a:'Her 20 dakikada bir, 6 metre (20 feet) uzağa, 20 saniye bak.'},
 {s:'Bilgisayar başında doğru oturuşla ilgili hangisi yanlıştır?',c:['Sırt dik ve destekli','Ayaklar yere düz basar','Ekran gözlere çok yakın','Bilekler düz durur'],a:2},
 {s:'Başımızı 60 derece öne eğince boynumuz yaklaşık kaç kilogram taşır?',a:'Yaklaşık 27 kilogram'},
 {s:'Ergonomi nedir?',a:'İnsanın, makinenin ve çevrenin uyumlu ve verimli çalışmasını inceleyen bilim dalı'},
 {s:'Siber zorbalığa uğrarsan ne yapmalısın? İki adım söyle.',a:'Cevap verme, kanıt sakla, engelle, güvendiğin bir yetişkine anlat.'},
 {s:'Kulaklıkta ses en fazla ne kadar olmalıdır?',c:['En yüksek seviyede','%90’ında','%60’ından az','Fark etmez'],a:2},
 {s:'Belirli bir süre dijital araçlardan bilinçli olarak uzak durmaya ne denir?',a:'Dijital detoks'},
 {s:'Yatmadan önce ekrana bakmak neden zararlıdır?',a:'Uykuya dalmayı zorlaştırır, uykuyu getiren melatonin azalır.'},
 {s:'Dizüstü bilgisayar neden yorgan üzerinde kullanılmamalıdır?',a:'Hava delikleri kapanır, cihaz aşırı ısınır.'},
 {s:'Dijital sağlığın üç boyutu nedir?',a:'Fiziksel, bilişsel-davranışsal, sosyal-duygusal'},
 {s:'Hangisi bir fiziksel güvenlik önlemidir?',c:['Prize ıslak elle dokunmamak','Şifresini paylaşmamak','Bildirimleri kapatmak','İnternette nazik olmak'],a:0}],
[{s:'Dijital kimlik nedir?',a:'İnternette bizi temsil eden bilgilerin bütünü: kullanıcı adı, avatar, paylaşımlar'},
 {s:'Dijital ayak izi nedir?',a:'İnternette yaptığımız her şeyin arkamızda bıraktığı izler'},
 {s:'Hangisi farkında olmadan bıraktığımız bir dijital ayak izidir?',c:['Fotoğraf paylaşmak','Yorum yazmak','Konumun kaydedilmesi','Gönderi beğenmek'],a:2},
 {s:'Güçlü bir şifre nasıl olmalıdır?',a:'Uzun olmalı; büyük-küçük harf, rakam ve sembol içermeli; her hesapta farklı olmalı.'},
 {s:'Paylaşmadan önceki üç adım nedir?',a:'Dur, düşün, karar ver!'},
 {s:'Arkadaşının komik fotoğrafını paylaşmadan önce ne yapmalısın?',c:['Hemen paylaşmalıyım','Ondan izin istemeliyim','Fotoğrafı değiştirmeliyim','Gizlice paylaşmalıyım'],a:1},
 {s:'Rumuz nedir? Neden kullanırız?',a:'Gerçek adımız yerine kullandığımız takma addır. Gizliliğimizi korur.'},
 {s:'EBA hangi kullanım alanına örnektir?',a:'Eğitim'},
 {s:'e-Nabız hangi kullanım alanına örnektir?',a:'Sağlık'},
 {s:'Gizliliğin ihlal edilirse kimlere başvurabilirsin?',a:'Ailene, öğretmenine, rehberlik servisine, BTK Güvenli İnternet Merkezine'},
 {s:'Silinen bir paylaşım neden tamamen yok olmayabilir?',a:'Ekran görüntüsü alınmış, başkalarına gönderilmiş ya da arşivlenmiş olabilir.'}],
[{s:'Yapay zekâ nedir?',a:'Makinelerin insanlar gibi öğrenmesini, karar vermesini ve sorun çözmesini sağlayan teknoloji'},
 {s:'Hangisi bir yapay zekâ örneğidir?',c:['Bisiklet','Analog saat','Sesli asistan','Kitap'],a:2},
 {s:'“Yapay zekâ” terimini ilk kim kullandı?',a:'John McCarthy (1956)'},
 {s:'1959’da Erzurum’da “Makine düşünebilir mi?” konferansını veren Türk matematikçi kimdir?',a:'Cahit Arf'},
 {s:'“Algoritma” kelimesi hangi bilim insanının adından gelir?',a:'Harezmî'},
 {s:'Yapay zekâ nasıl öğrenir?',a:'Çok sayıda örneği (veriyi) inceleyerek benzerlikleri bulur.'},
 {s:'1997’de satrançta dünya şampiyonunu yenen bilgisayar hangisidir?',c:['AlphaGo','Deep Blue','ENIAC','Mark II'],a:1},
 {s:'Doğal zekânın yapay zekâdan bir farkını söyle.',a:'Duyguları ve hayal gücü vardır, az örnekle öğrenir, yorulur.'},
 {s:'Yapay zekâdan aldığın bir bilginin doğruluğunu nasıl kontrol edersin?',a:'Güvenilir başka kaynaklardan kontrol ederim.'},
 {s:'Yapay zekânın sağlıktaki bir faydası nedir? Neye dikkat etmeliyiz?',a:'Erken teşhise yardım eder. Ama son kararı doktor vermelidir.'},
 {s:'Video sitesinin izlediğine benzer videolar önermesi hangi uygulamadır?',c:['Yüz tanıma','Öneri sistemi','Çeviri uygulaması','Sürücüsüz araç'],a:1}],
[{s:'1 bayt kaç bittir?',a:'8 bit'},
 {s:'1 GB kaç MB eder?',a:'1024 MB'},
 {s:'Hangisi bir iç donanım birimidir?',c:['Klavye','Anakart','Yazıcı','Hoparlör'],a:1},
 {s:'Bilgisayarın beyni olarak bilinen parça hangisidir?',a:'İşlemci (CPU)'},
 {s:'Yazıcı giriş birimi mi, çıkış birimi mi?',a:'Çıkış birimi'},
 {s:'Hem giriş hem çıkış birimine bir örnek ver.',a:'Dokunmatik ekran, mikrofonlu kulaklık'},
 {s:'Ctrl + Z kısayolu ne işe yarar?',a:'Son yapılan işlemi geri alır.'},
 {s:'Okulumuzdaki bilgisayarlarda kullanılan Pardus’u hangi kurum geliştirdi?',a:'TÜBİTAK'},
 {s:'Dosyalarına her yerden ulaşmak isteyen biri hangisini seçmelidir?',c:['Sabit disk','RAM bellek','Bulut depolama','Disket'],a:2},
 {s:'Bilgisayarın çalışma düzeninin dört adımı nedir?',a:'Girdi → işlem → çıktı → depolama'},
 {s:'4 GB boş alana 4 MB’lık kaç fotoğraf sığar?',a:'4 GB = 4096 MB · 4096 ÷ 4 = 1024 fotoğraf'},
 {s:'Bilgisayar kapanınca içindekiler silinen geçici bellek hangisidir?',a:'RAM bellek'}],
[{s:'Dosya taşıma ile kopyalama arasındaki fark nedir?',a:'Taşımada dosya eski yerinde kalmaz. Kopyalamada asıl dosya yerinde kalır.'},
 {s:'Bir dosyayı kopyalamak için hangi kısayol kullanılır?',c:['Ctrl + C','Ctrl + X','Ctrl + Z','Ctrl + A'],a:0},
 {s:'.mp3 uzantılı bir dosya hangi türdedir?',a:'Ses (müzik) dosyası'},
 {s:'Sildiğin bir dosya önce nereye gider?',a:'Geri Dönüşüm Kutusuna (Çöp Sepeti)'},
 {s:'Hangisi en anlamlı dosya adıdır?',c:['yeni.docx','asdf.docx','fen-odevi_bitkiler.docx','son.docx'],a:2},
 {s:'Dosya sıkıştırmanın bir faydasını söyle.',a:'Yer kazandırır, dosyalar daha hızlı gönderilir, birçok dosya tek dosyada toplanır.'},
 {s:'Bir dosyanın adını değiştirmek için hangi tuşa basarız?',a:'F2'},
 {s:'Kâğıttaki bir belgeyi tarayıp bilgisayara aktarmaya ne denir?',a:'Dijitalleştirme'},
 {s:'.zip uzantılı dosya hangi türdedir?',a:'Sıkıştırılmış dosya'},
 {s:'Dosya adına tarihi neden yıl-ay-gün sırasıyla yazmalıyız?',a:'Dosyalar ada göre sıralanınca kendiliğinden tarih sırasına girer.'},
 {s:'İlk dijital fotoğraf kaç piksel büyüklüğündeydi?',a:'176 × 176 piksel'}]];
const TAKIM=['Turuncu takım','Mor takım'];
const $=s=>document.querySelector(s), sahne=$('#sahne');
const el=(t,o={},...c)=>{const e=document.createElement(t);Object.entries(o).forEach(([k,v])=>k==='class'?e.className=v:k.startsWith('on')?e[k]=v:e.setAttribute(k,v));c.flat().forEach(x=>x!=null&&e.append(x));return e};
const ayar={mod:'konu',takim:'takim',konular:[0,1,2,3,4,5],sinif:30};
let D=null, ses=true, ac=null;

function bip(f,t=.15,tip='triangle'){if(!ses)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=tip;o.frequency.value=f;g.gain.setValueAtTime(.22,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+t)}catch(e){}}
$('#ses').onclick=()=>{ses=!ses;$('#ses').textContent=ses?'🔊 Ses':'🔇 Ses';$('#ses').setAttribute('aria-pressed',String(ses))};

function skorCiz(){const k=$('#skor');k.innerHTML='';if(!D)return;
  if(D.takim)[0,1].forEach(i=>k.append(el('span',{class:'takim '+(i?'b':'a')+(D.mod==='konu'&&D.sira===i?' sira':'')},`${TAKIM[i]}: ${D.puan[i]}`)));
  else if(D.mod==='konu')k.append(el('span',{class:'takim'},`Doğru: ${D.dogru}`),el('span',{class:'takim'},`Yanlış: ${D.yanlis}`));
  k.append(el('button',{class:'kucuk-dugme',onclick:bitir},'Oyunu bitir'));}

// ---------- giriş ----------
function giris(){D=null;skorCiz();
  const konuSec=el('div',{class:'secim konu',id:'konular'},KONULAR.map((k,i)=>el('button',{'data-i':i,onclick:e=>{const j=ayar.konular.indexOf(i);if(j>=0){if(ayar.konular.length>1)ayar.konular.splice(j,1)}else ayar.konular.push(i);yenile()}},k.ad,el('small',{},SORULAR[i].length+' soru'))));
  const sinifGir=el('input',{type:'number',min:'2',max:'40',value:ayar.sinif,id:'sinif','aria-label':'Sınıf mevcudu'});
  const ek=el('div',{style:'display:flex;flex-direction:column;gap:10px;align-items:center'});
  const modSec=el('div',{class:'secim',id:'mod'},
    el('button',{'data-v':'konu',onclick:()=>{ayar.mod='konu';yenile()}},'Konu çarkı',el('small',{},'Çark bir konu seçer, o konudan soru gelir')),
    el('button',{'data-v':'numara',onclick:()=>{ayar.mod='numara';yenile()}},'Numara çarkı',el('small',{},'Çark bir öğrenci numarası seçer')));
  const takimSec=el('div',{class:'secim',id:'takim'},
    el('button',{'data-v':'takim',onclick:()=>{ayar.takim='takim';yenile()}},'İki takım',el('small',{},'Sırayla çevirin, puan toplayın')),
    el('button',{'data-v':'tek',onclick:()=>{ayar.takim='tek';yenile()}},'Tüm sınıf',el('small',{},'Doğru ve yanlış sayılır')));
  function yenile(){modSec.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===ayar.mod)));
    takimSec.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===ayar.takim)));
    konuSec.querySelectorAll('button').forEach(b=>{const on=ayar.konular.includes(+b.dataset.i);b.setAttribute('aria-pressed',String(on));b.style.background=on?KONULAR[+b.dataset.i].renk:''});
    ek.innerHTML='';
    if(ayar.mod==='konu')ek.append(el('div',{class:'etiket-s'},'Hangi konular çarkta olsun?'),konuSec,el('div',{class:'etiket-s'},'Nasıl oynayalım?'),takimSec);
    else ek.append(el('div',{class:'etiket-s'},'Sınıf mevcudu'),sinifGir,el('p',{class:'not'},'Çıkan numara bir daha gelmez. Öğrenci adları kullanılmaz, yalnızca numaralar.'));}
  sahne.innerHTML='';
  sahne.append(el('section',{class:'ekran'},
    el('h2',{},'Çarkı çevir, soruyu kap!'),
    el('p',{},'Çark 1. temanın altı konusundan birini seçer. Soru ekrana gelir, sınıf düşünür, öğretmen cevabı açar. Çarkı ortadaki düğmeyle ya da boşluk tuşuyla çevirebilirsin.'),
    el('div',{class:'etiket-s'},'Çark türü'),modSec,ek,
    el('button',{class:'dugme',onclick:basla},'Oyuna başla'),
    el('p',{class:'hazirlayan'},el('b',{},'Hazırlayan: Ayşegül SARIKOZ (BTY Dersi Öğretmeni)'),' · Türkkonut Ortaokulu')));
  yenile();}

// ---------- oyun ----------
function basla(){
  if(ayar.mod==='numara'){const n=Math.max(2,Math.min(40,parseInt($('#sinif').value)||30));ayar.sinif=n;
    D={mod:'numara',takim:false,dilimler:Array.from({length:n},(_,i)=>({no:i+1,etiket:String(i+1),renk:KONULAR[i%6].renk})),cikan:[],aci:0,donuyor:false};}
  else{const k=[...ayar.konular].sort((a,b)=>a-b);let dil=k.map(i=>({konu:i,etiket:KONULAR[i].ad,renk:KONULAR[i].renk}));while(dil.length<8)dil=dil.concat(k.map(i=>({konu:i,etiket:KONULAR[i].ad,renk:KONULAR[i].renk})));
    D={mod:'konu',takim:ayar.takim==='takim',dilimler:dil,kalan:SORULAR.map(l=>l.map((_,j)=>j)),puan:[0,0],sira:0,dogru:0,yanlis:0,aci:0,donuyor:false};}
  sahne.innerHTML='';
  const kap=el('div',{class:'cark-kap'},el('div',{class:'ok'}),el('canvas',{id:'cark',width:'1000',height:'1000','aria-label':'Çark'}),el('button',{class:'cevir',id:'cevir',onclick:cevir},'ÇEVİR'));
  sahne.append(el('div',{class:'sahne'},kap,el('section',{class:'panel',id:'panel','aria-live':'polite'})));
  cizCark();$('#cark').addEventListener('transitionend',dondu);bekleme();skorCiz();}

function cizCark(){const c=$('#cark').getContext('2d'),n=D.dilimler.length,dil=2*Math.PI/n;c.clearRect(0,0,1000,1000);
  D.dilimler.forEach((d,i)=>{const a0=-Math.PI/2+i*dil;
    c.beginPath();c.moveTo(500,500);c.arc(500,500,490,a0,a0+dil);c.closePath();c.fillStyle=d.renk;c.globalAlpha=d.cikti?.25:1;c.fill();c.globalAlpha=1;
    c.strokeStyle='#fff';c.lineWidth=5;c.stroke();
    c.save();c.translate(500,500);c.rotate(a0+dil/2);c.fillStyle='#fff';c.textAlign='right';c.textBaseline='middle';
    if(D.mod==='numara'){c.font=`800 ${n>30?42:n>20?54:72}px "Baloo 2","Trebuchet MS",sans-serif`;c.fillText(d.etiket,460,0);}
    else{c.font='800 50px "Baloo 2","Trebuchet MS",sans-serif';const w=d.etiket.split(' ');
      if(w.length>1&&c.measureText(d.etiket).width>330){c.fillText(w[0],460,-28);c.fillText(w.slice(1).join(' '),460,30);}else c.fillText(d.etiket,455,0);}
    c.restore();});
  c.beginPath();c.arc(500,500,490,0,2*Math.PI);c.lineWidth=18;c.strokeStyle='#1E3A8A';c.stroke();
  for(let k=0;k<24;k++){const a=k*Math.PI/12;c.beginPath();c.arc(500+490*Math.cos(a),500+490*Math.sin(a),9,0,2*Math.PI);c.fillStyle=k%2?'#FDE68A':'#fff';c.fill();}}

function bekleme(mesaj){const p=$('#panel');p.innerHTML='';
  if(D.mod==='numara'){p.append(el('div',{class:'bekle'},el('span',{class:'buyuk'},'Kimin sırası?'),'Çarkı çevir, bir numara çıksın!'));
    if(D.cikan.length)p.append(el('div',{class:'etiket-s',style:'text-align:center'},'Çıkan numaralar'),el('div',{class:'cikanlar'},D.cikan.map(x=>el('span',{},x))));return;}
  p.append(el('div',{class:'bekle'},el('span',{class:'buyuk'},D.takim?`Sıra ${TAKIM[D.sira]}ta!`:'Hazır mısınız?'),mesaj||'Çarkı çevir, bir konu seçilsin!'),
    el('p',{class:'not',style:'text-align:center'},`Kalan soru: ${D.kalan.reduce((t,l,i)=>t+(ayar.konular.includes(i)?l.length:0),0)}`));}

function cevir(){if(!D||D.donuyor)return;
  let adaylar=D.dilimler.map((d,i)=>i).filter(i=>D.mod==='numara'?!D.dilimler[i].cikti:D.kalan[D.dilimler[i].konu].length>0);
  if(!adaylar.length){const p=$('#panel');p.innerHTML='';p.append(el('div',{class:'bekle'},el('span',{class:'buyuk'},D.mod==='numara'?'Bütün numaralar çıktı!':'Bütün sorular soruldu!'),''),el('div',{class:'dugmeler',style:'justify-content:center'},el('button',{class:'dugme lac',onclick:()=>{if(D.mod==='numara'){D.dilimler.forEach(d=>d.cikti=false);D.cikan=[];}else D.kalan=SORULAR.map(l=>l.map((_,j)=>j));cizCark();bekleme()}},'Baştan başlat'),el('button',{class:'dugme',onclick:bitir},'Oyunu bitir')));return;}
  const i=adaylar[Math.floor(Math.random()*adaylar.length)],n=D.dilimler.length,dil=360/n,ofs=dil*(.2+Math.random()*.6);
  const hedef=(360-(i*dil+ofs))%360,mod=((D.aci%360)+360)%360;
  D.aci=D.aci-mod+360*6+hedef;D.secilen=i;D.donuyor=true;$('#cevir').disabled=true;
  bip(520,.12);setTimeout(()=>bip(660,.1),120);
  $('#cark').style.transform=`rotate(${D.aci}deg)`;clearTimeout(D.yedek);D.yedek=setTimeout(dondu,4700);}

function dondu(){if(!D||!D.donuyor)return;D.donuyor=false;clearTimeout(D.yedek);$('#cevir').disabled=false;bip(988,.35);setTimeout(()=>bip(1319,.4),140);
  const d=D.dilimler[D.secilen],p=$('#panel');p.innerHTML='';
  if(D.mod==='numara'){d.cikti=true;D.cikan.push(d.no);cizCark();
    p.append(el('div',{class:'etiket-s',style:'text-align:center'},'Sıradaki öğrenci'),el('div',{class:'numara',style:`color:${d.renk}`},String(d.no)),el('p',{class:'not',style:'text-align:center'},'numaralı öğrenci'),
      el('div',{class:'cikanlar'},D.cikan.map(x=>el('span',{},x))));return;}
  const l=D.kalan[d.konu],j=l.splice(Math.floor(Math.random()*l.length),1)[0],q=SORULAR[d.konu][j];
  p.append(el('span',{class:'rozet',style:`background:${d.renk}`},KONULAR[d.konu].uzun),el('div',{class:'soru'},q.s));
  let sec=null;if(q.c){sec=el('div',{class:'secenek'},q.c.map((x,k)=>el('div',{},el('b',{},'ABCD'[k]),x)));p.append(sec);}
  const alt=el('div',{class:'dugmeler'},el('button',{class:'dugme lac',onclick:()=>goster()},'Cevabı göster'));p.append(alt);
  function goster(){alt.remove();bip(784,.2);
    if(q.c){sec.children[q.a].classList.add('dogru');p.append(el('div',{class:'cevap'},'Doğru cevap: '+'ABCD'[q.a]+') '+q.c[q.a]));}
    else p.append(el('div',{class:'cevap'},q.a));
    const sonra=()=>{if(D.takim)D.sira=1-D.sira;skorCiz();bekleme()};
    let b;
    if(D.takim){const o=D.sira;b=el('div',{class:'dugmeler'},
      el('button',{class:'dugme '+(o?'mor':''),onclick:()=>{D.puan[o]+=10;bip(1047,.2);sonra()}},`${TAKIM[o]} bildi +10`),
      el('button',{class:'dugme '+(o?'':'mor'),onclick:()=>{D.puan[1-o]+=5;bip(1047,.2);sonra()}},`${TAKIM[1-o]} bildi +5`),
      el('button',{class:'dugme gri',onclick:sonra},'Bilen olmadı'));}
    else b=el('div',{class:'dugmeler'},el('button',{class:'dugme yes',onclick:()=>{D.dogru++;sonra()}},'Bildik ✓'),el('button',{class:'dugme gri',onclick:()=>{D.yanlis++;sonra()}},'Bilemedik'));
    p.append(b);}}

function bitir(){if(!D)return giris();const p=el('section',{class:'ekran'});
  if(D.mod==='numara')p.append(el('h2',{},'Çark durdu!'),el('p',{},`${D.cikan.length} numara çıktı.`));
  else if(D.takim){const [a,b]=D.puan,k=a===b?'Berabere!':(a>b?TAKIM[0]:TAKIM[1])+' kazandı!';
    p.append(el('div',{class:'kazanan'},'🏆'),el('h2',{},k),el('p',{},`${TAKIM[0]}: ${a} puan · ${TAKIM[1]}: ${b} puan`));}
  else p.append(el('div',{class:'kazanan'},'⭐'),el('h2',{},'Tebrikler sınıf!'),el('p',{},`${D.dogru} doğru · ${D.yanlis} bilinemeyen soru`));
  p.append(el('button',{class:'dugme',onclick:giris},'Yeni oyun'),el('p',{class:'hazirlayan'},el('b',{},'Hazırlayan: Ayşegül SARIKOZ (BTY Dersi Öğretmeni)'),' · Türkkonut Ortaokulu'));
  D=null;skorCiz();sahne.innerHTML='';sahne.append(p);}

document.addEventListener('keydown',e=>{if(e.code==='Space'&&D&&document.activeElement.tagName!=='INPUT'){e.preventDefault();cevir()}});
giris();
</script>

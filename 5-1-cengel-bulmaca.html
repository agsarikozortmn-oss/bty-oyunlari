<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Çengel Bulmaca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{color-scheme:light;--lacivert:#1E3A8A;--turuncu:#EA580C;--mavi:#2563EB;--mavi-z:#DBEAFE;--yesil:#16A34A;--yesil-z:#DCFCE7;--kirmizi:#DC2626;--kirmizi-z:#FEE2E2;--mor:#7C3AED;--mor-z:#EDE9FE;--sari:#CA8A04;--sari-z:#FEF9C3;--pembe:#DB2777;--camgob:#0E7490;
  --metin:#1E293B;--soluk:#64748B;--cizgi:#CBD5E1;--f-baslik:"Baloo 2","Trebuchet MS",system-ui,sans-serif;--f-govde:"Nunito","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--metin);font-family:var(--f-govde);font-size:20px;padding:10px;-webkit-user-select:none;user-select:none;
  background:radial-gradient(circle at 6% 10%,#FDE68A 0 110px,transparent 111px),radial-gradient(circle at 94% 92%,#FBCFE8 0 150px,transparent 151px),radial-gradient(circle at 96% 8%,#BFDBFE 0 80px,transparent 81px),radial-gradient(circle at 4% 94%,#BBF7D0 0 100px,transparent 101px),linear-gradient(135deg,#EEF2FF,#FDF4FF 55%,#ECFEFF)}
h1,h2,h3{font-family:var(--f-baslik);margin:0;line-height:1.15}
.kap{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.ust{background:linear-gradient(90deg,#1E3A8A,#7C3AED 60%,#DB2777);color:#fff;border-radius:16px;padding:8px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;box-shadow:0 4px 14px rgba(124,58,237,.3)}
.ust h1{font-size:clamp(24px,2.8vw,36px);flex:1 1 280px}
.skor{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cip{border-radius:12px;padding:4px 16px;font-family:var(--f-baslik);font-size:clamp(20px,2vw,28px);background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.35);font-variant-numeric:tabular-nums}
.cip.a.sira{background:var(--turuncu);border-color:#fff}.cip.b.sira{background:var(--mor);border-color:#fff}
.kdugme{font:inherit;font-weight:800;font-size:16px;border:2px solid rgba(255,255,255,.45);background:transparent;color:#fff;border-radius:10px;padding:5px 12px;cursor:pointer}
.kutu{background:#fff;border-radius:24px;border:5px solid #C4B5FD;padding:20px 24px;box-shadow:0 4px 16px rgba(30,58,138,.1)}
.dugme{font-family:var(--f-baslik);font-weight:800;font-size:clamp(22px,2.1vw,30px);border:0;border-radius:16px;padding:12px 28px;cursor:pointer;background:var(--turuncu);color:#fff;box-shadow:0 5px 0 #9A3412}
.dugme:active{transform:translateY(2px);box-shadow:0 2px 0 #9A3412}
.dugme.lac{background:var(--lacivert);box-shadow:0 5px 0 #172554}.dugme.yes{background:var(--yesil);box-shadow:0 5px 0 #14532D}
.dugme.mor{background:var(--mor);box-shadow:0 5px 0 #4C1D95}.dugme.kir{background:var(--kirmizi);box-shadow:0 5px 0 #7F1D1D}.dugme.gri{background:#64748B;box-shadow:0 5px 0 #334155}
.dugme:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:5px solid var(--turuncu);outline-offset:3px}
.ekran{background:#fff;border:5px solid #C4B5FD;border-radius:26px;padding:24px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.ekran h2{font-size:clamp(32px,4.2vw,56px);color:var(--lacivert)}
.ekran p{margin:0;font-size:clamp(20px,2vw,26px);max-width:920px}
.etiket-s{font-weight:800;color:var(--soluk);font-size:18px;letter-spacing:.06em;text-transform:uppercase}
.secim{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.secim button{font:inherit;font-weight:800;font-size:21px;padding:10px 18px;border-radius:14px;border:3px solid var(--cizgi);background:#fff;color:var(--metin);cursor:pointer;min-width:160px}
.secim button[aria-pressed="true"]{border-color:var(--turuncu);background:#FFEDD5;color:#9A3412}
.secim small{display:block;font-weight:600;color:var(--soluk);font-size:15px}
.cevap{background:var(--yesil-z);border:4px solid var(--yesil);border-radius:16px;padding:12px 18px;font-size:clamp(24px,2.6vw,36px);font-weight:800;color:#14532D;animation:gel .35s ease-out}
.yanlis-k{background:var(--kirmizi-z);border:4px solid var(--kirmizi);border-radius:16px;padding:12px 18px;font-size:clamp(22px,2.3vw,32px);font-weight:800;color:#7F1D1D;animation:gel .35s ease-out}
@keyframes gel{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes salla{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.salla{animation:salla .4s}
.buyuk-ikon{font-size:72px;line-height:1}
.not{font-size:18px;color:var(--soluk)}
.hazirlayan{font-size:14px;color:#64748B;margin:4px 0 0}.hazirlayan b{color:#1E3A8A}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.konular{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;width:100%}
.konular button{font:inherit;font-family:var(--f-baslik);font-size:24px;color:#fff;border:0;border-radius:20px;padding:16px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.alan{display:grid;grid-template-columns:auto minmax(280px,1fr);gap:14px;align-items:start}
.tahta{display:grid;gap:3px;background:transparent;padding:8px;border-radius:18px;background:#fff;border:5px solid #C4B5FD}
.h{position:relative;background:transparent}
.h.dolu{background:#F8FAFC;border:3px solid var(--lacivert);border-radius:6px;display:grid;place-items:center;font-family:var(--f-baslik);font-weight:800;color:var(--lacivert);cursor:pointer;line-height:1}
.h.dolu.aktif{background:#FEF3C7}
.h.dolu.imlec{background:#FDE68A;border-color:var(--turuncu)}
.h.dolu.dogru{background:var(--yesil-z);border-color:var(--yesil)}
.h.dolu.yanlis{background:var(--kirmizi-z);border-color:var(--kirmizi)}
.h .no{position:absolute;top:1px;left:3px;font-family:var(--f-govde);font-size:max(11px,.28em);color:var(--mor);font-weight:800}
.ipuclari{background:#fff;border:5px solid #C4B5FD;border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 190px);overflow:auto}
.ipuclari h3{margin:4px 0 0;font-family:var(--f-baslik);font-size:24px;color:var(--mor)}
.ip{border-radius:12px;padding:6px 10px;font-weight:700;font-size:clamp(17px,1.5vw,21px);cursor:pointer;border:3px solid transparent}
.ip b{color:var(--mor);margin-right:6px}
.ip.aktif{background:#FEF3C7;border-color:var(--sari)}
.ip.tamam{text-decoration:line-through;color:var(--soluk)}
.araclar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.araclar .dugme{font-size:19px;padding:8px 14px}
.klavye{display:none;flex-direction:column;gap:5px;margin-top:8px}
.klavye div{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.klavye button{font:inherit;font-family:var(--f-baslik);font-weight:800;font-size:22px;width:40px;height:46px;border-radius:10px;border:0;background:var(--lacivert);color:#fff;cursor:pointer}
.dokun .klavye{display:flex}
@media (max-width:900px){.alan{grid-template-columns:1fr}.ipuclari{max-height:none}}
</style>
</head>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const el=(t,o={},...c)=>{const e=document.createElement(t);Object.entries(o).forEach(([k,v])=>v==null||v===false?0:k==='class'?e.className=v:k==='html'?e.innerHTML=v:k.startsWith('on')?e[k]=v:e.setAttribute(k,v));c.flat().forEach(x=>x!=null&&x!==false&&e.append(x));return e};

let SES=true,AC=null;
function bip(f,t=.15,tip='triangle'){if(!SES)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=tip;o.frequency.value=f;g.gain.setValueAtTime(.2,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+t)}catch(e){}}
const dogruSes=()=>{bip(784,.12);setTimeout(()=>bip(1047,.2),110)}, yanlisSes=()=>{bip(220,.25,'sawtooth')};
const IMZA=()=>el('p',{class:'hazirlayan'},el('b',{},'Hazırlayan: Ayşegül SARIKOZ (BTY Dersi Öğretmeni)'),' · Türkkonut Ortaokulu');
function sesDugmesi(){const b=el('button',{class:'kdugme','aria-pressed':'true'},'Ses: açık');b.onclick=()=>{SES=!SES;b.textContent='Ses: '+(SES?'açık':'kapalı');b.setAttribute('aria-pressed',String(SES))};return b}
function secimGrubu(secenekler,deger,degis){const g=el('div',{class:'secim'});const yen=()=>g.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===String(deger()))));
  secenekler.forEach(([v,ad,alt])=>g.append(el('button',{'data-v':v,onclick:()=>{degis(v);yen()}},ad,alt?el('small',{},alt):null)));yen();return g}

const OYUN={"baslik": "Çengel Bulmaca", "konular": [{"ad": "Bilişim Teknolojileri", "kelimeler": [["Donanım", "Bilgisayarın elle dokunulabilen parçaları"], ["Yazılım", "Donanıma ne yapacağını söyleyen programlar"], ["İnternet", "Dünyadaki bilgisayarları birbirine bağlayan ağ"], ["Tablet", "Dokunmatik ekranlı, taşınabilir bilgisayar"], ["Robot", "Programlanarak iş yapan makine"], ["Sensör", "Isı, ışık, hareket gibi değişiklikleri algılayan parça"], ["Telgraf", "Mors alfabesiyle haberleşmeyi sağlayan eski araç"], ["Abaküs", "Boncuklarla hesap yapılan ilk hesaplama aracı"], ["Uydu", "Dünya’nın çevresinde dolaşan ve iletişim sağlayan araç"], ["Akıllı saat", "Bileğe takılan, adım ve nabız ölçebilen cihaz"], ["Bilgi", "İşlenmiş, anlamlı hâle gelmiş veri"], ["Veri", "İşlenmemiş ham bilgi parçası"], ["İletişim", "Bilginin bir kişiden diğerine aktarılması"]]}, {"ad": "Dijital Sağlık", "kelimeler": [["Ergonomi", "Araçları vücudumuza uygun ve sağlıklı kullanma bilimi"], ["Duruş", "Bilgisayar başında dik ve doğru oturma şekli"], ["Mola", "Ekran başında her 20-30 dakikada verilen ara"], ["Uyku", "Ekranları yatmadan önce kapatmak bunu iyileştirir"], ["Bağımlılık", "Teknolojiyi bırakamama, sürekli kullanma isteği"], ["Zorbalık", "İnternette başkasını üzme, korkutma veya alay etme"], ["Göz", "20-20-20 kuralıyla dinlendirdiğimiz organ"], ["Egzersiz", "Mola sırasında yapılan esneme ve hareketler"], ["Denge", "Ekran süresi ile diğer etkinlikler arasındaki uyum"], ["Aile", "Sorun yaşadığımızda ilk haber verdiğimiz kişiler"], ["Engelle", "Rahatsız eden kişiye uygulanan işlem"], ["Bildir", "Uygunsuz içeriği şikâyet etme"]]}, {"ad": "Dijital Vatandaşlık", "kelimeler": [["Rumuz", "İnternette gerçek ad yerine kullanılan takma ad"], ["Avatar", "Fotoğraf yerine kullanılan çizgi resim"], ["Gizlilik", "Kişisel bilgilerin başkalarıyla paylaşılmaması"], ["Şifre", "Hesaplarımızı koruyan gizli anahtar"], ["Görgü", "İnternette saygılı ve kibar davranma kuralları"], ["Hukuk", "İnternette uyulması gereken yasalar"], ["Telif", "Bir eserin sahibine ait olan hak"], ["Kaynak", "Kullandığımız bilginin nereden alındığı"], ["Ayak izi", "İnternette bıraktığımız kalıcı izler"], ["Erişim", "Herkesin teknolojiye ulaşabilmesi"], ["Ticaret", "İnternetten alışveriş yapma"], ["Güvenlik", "Cihazları ve bilgileri tehlikelere karşı koruma"], ["Sorumluluk", "Yaptığımız paylaşımların sonucunu üstlenme"]]}, {"ad": "Yapay Zekâ", "kelimeler": [["Algoritma", "Bir işi yapmak için sıralı adımlar"], ["Veri", "Yapay zekânın öğrenmek için kullandığı bilgiler"], ["Öğrenme", "Örneklerden kural çıkarma"], ["Robot", "Yapay zekâ ile hareket edebilen makine"], ["Asistan", "Sesli komutlarla çalışan yardımcı yazılım"], ["Tanıma", "Yüz, ses veya nesneyi ayırt etme"], ["Tahmin", "Önceki verilere bakarak geleceği kestirme"], ["Çeviri", "Bir dili başka bir dile aktarma"], ["Etik", "Yapay zekâyı doğru ve adil kullanma kuralları"], ["Arf", "“Makine düşünebilir mi?” konferansını veren Türk matematikçi"], ["Turing", "Makinelerin düşünüp düşünemeyeceğini test eden bilim insanı"], ["Sohbet", "Yapay zekâ ile yazışarak konuşma"], ["Model", "Verilerle eğitilmiş yapay zekâ programı"]]}, {"ad": "Bilgisayar Sistemleri", "kelimeler": [["İşlemci", "Bilgisayarın beyni (CPU)"], ["Anakart", "Tüm parçaların takıldığı ana devre kartı"], ["Bellek", "Geçici bilgileri tutan RAM"], ["Klavye", "Harf ve sayı girmeye yarayan giriş birimi"], ["Fare", "İmleci hareket ettiren giriş birimi"], ["Yazıcı", "Belgeleri kâğıda aktaran çıkış birimi"], ["Hoparlör", "Ses veren çıkış birimi"], ["Monitör", "Görüntü veren çıkış birimi"], ["Kamera", "Görüntü alan giriş birimi"], ["Depolama", "Dosyaları kalıcı olarak saklama"], ["Pardus", "Okullarımızda kullanılan yerli işletim sistemi"], ["Bayt", "Sekiz bitten oluşan veri birimi"], ["Girdi", "Bilgisayara verilen veri"]]}, {"ad": "Dosya ve Klasör", "kelimeler": [["Dosya", "Bilgisayarda saklanan belge, resim veya ses"], ["Klasör", "Dosyaları düzenli saklamak için kullanılan kutu"], ["Uzantı", "Dosya adının sonundaki noktadan sonraki kısım"], ["Kopyala", "Dosyanın bir benzerini oluşturma"], ["Taşı", "Dosyayı başka bir yere götürme"], ["Sil", "Dosyayı çöp kutusuna gönderme"], ["Yedek", "Dosyanın kaybolmasına karşı saklanan kopyası"], ["Masaüstü", "Bilgisayar açıldığında gördüğümüz ilk ekran"], ["Simge", "Dosya veya programı gösteren küçük resim"], ["Sıkıştır", "Dosyayı ZIP yaparak küçültme"], ["Arama", "Kaybolan dosyayı bulma"], ["Kaydet", "Yapılan çalışmayı saklama"], ["Çöp kutusu", "Silinen dosyaların geçici olarak gittiği yer"]]}]};
document.title=OYUN.baslik;$('#baslik').textContent=OYUN.baslik;$('#sesyer').append(sesDugmesi());
const sahne=$('#sahne'),RENK=['#EA580C','#2563EB','#16A34A','#7C3AED','#DB2777','#0E7490'];let D=null;
const UP=s=>s.toLocaleUpperCase('tr').replace(/Â/g,'A').replace(/Î/g,'İ').replace(/Û/g,'U').replace(/[^A-ZÇĞIİÖŞÜ]/g,'');
const HARF='ABCÇDEFGĞHIİJKLMNOÖPRSŞTUÜVYZ';

function olustur(liste,hedef){let en=null;
  for(let deneme=0;deneme<40;deneme++){const ks=karistir(liste).map(([w,t])=>({w,t,k:UP(w)})).filter(x=>x.k.length>=3&&x.k.length<=11);ks.sort((a,b)=>b.k.length-a.k.length);
    const G=new Map(),key=(x,y)=>x+','+y,yer=[];
    const koy=(o,x,y,d)=>{for(let i=0;i<o.k.length;i++)G.set(key(x+(d?0:i),y+(d?i:0)),o.k[i]);yer.push({...o,x,y,d})};
    const uygun=(o,x,y,d)=>{let kes=0;const L=o.k.length,dx=d?0:1,dy=d?1:0;
      if(G.has(key(x-dx,y-dy))||G.has(key(x+dx*L,y+dy*L)))return -1;
      for(let i=0;i<L;i++){const cx=x+dx*i,cy=y+dy*i,c=G.get(key(cx,cy));
        if(c){if(c!==o.k[i])return -1;kes++;}
        else if(G.has(key(cx+dy,cy+dx))||G.has(key(cx-dy,cy-dx)))return -1;}
      return kes;};
    koy(ks[0],0,0,0);
    for(const o of ks.slice(1)){if(yer.length>=hedef)break;let iyi=null;
      for(const p of yer)for(let i=0;i<p.k.length;i++)for(let j=0;j<o.k.length;j++){if(p.k[i]!==o.k[j])continue;const d=1-p.d;
        const x=p.d?p.x-j:p.x+i, y=p.d?p.y+i:p.y-j;const k=uygun(o,x,y,d);if(k>0&&(!iyi||k>iyi.k||Math.random()<.3&&k===iyi.k))iyi={x,y,d,k};}
      if(iyi)koy(o,iyi.x,iyi.y,iyi.d);}
    const xs=[...G.keys()].map(k=>+k.split(',')[0]),ys=[...G.keys()].map(k=>+k.split(',')[1]);
    const w=Math.max(...xs)-Math.min(...xs)+1,h=Math.max(...ys)-Math.min(...ys)+1,puan=yer.length*10-Math.abs(w-h*1.5);
    if(!en||puan>en.puan){const mx=Math.min(...xs),my=Math.min(...ys);en={puan,w,h,yer:yer.map(o=>({...o,x:o.x-mx,y:o.y-my}))}}}
  // numaralandır
  const bas=[...new Set(en.yer.map(o=>o.y*100+o.x))].sort((a,b)=>a-b);en.yer.forEach(o=>o.no=bas.indexOf(o.y*100+o.x)+1);return en;}

function skorCiz(){const k=$('#skor');k.innerHTML='';if(!D)return;k.append(el('span',{class:'cip'},`Tamamlanan: ${D.yer.filter(o=>o.tamam).length} / ${D.yer.length}`),el('button',{class:'kdugme',onclick:giris},'Konulara dön'));}
function giris(){D=null;skorCiz();sahne.innerHTML='';
  sahne.append(el('section',{class:'ekran'},el('h2',{},OYUN.baslik),el('p',{html:md('İpuçlarını oku, kelimeleri kutulara yaz. Bir kutuya tıkla ve **klavyeyle** yaz. Akıllı tahtada ekrandaki harfleri kullanabilirsin.')}),
    el('div',{class:'etiket-s'},'Konu seç'),el('div',{class:'konular'},OYUN.konular.map((k,i)=>el('button',{style:`background:${RENK[i%RENK.length]}`,onclick:()=>basla(i)},k.ad))),IMZA()));}
function basla(ki){const K=OYUN.konular[ki],b=olustur(K.kelimeler,9);D={ki,...b,giris:{},imlec:null,yon:0};skorCiz();sahne.innerHTML='';
  const boy=Math.floor(Math.min((innerHeight-170)/b.h,(innerWidth*.58)/b.w))-3;
  const t=el('div',{class:'tahta',style:`grid-template-columns:repeat(${b.w},${boy}px);grid-auto-rows:${boy}px`});
  const hucreler={};b.yer.forEach(o=>{for(let i=0;i<o.k.length;i++){const x=o.x+(o.d?0:i),y=o.y+(o.d?i:0);hucreler[x+','+y]=o.k[i]}});D.cevap=hucreler;
  for(let y=0;y<b.h;y++)for(let x=0;x<b.w;x++){const c=hucreler[x+','+y];const h=el('div',{class:'h'+(c?' dolu':''),'data-x':x,'data-y':y,style:`font-size:${boy*.6}px`});
    if(c){const no=b.yer.find(o=>o.x===x&&o.y===y);if(no)h.append(el('span',{class:'no'},String(no.no)));h.append(el('span',{class:'hf'}));h.onclick=()=>sec(x,y,true)}t.append(h)}
  const ip=el('aside',{class:'ipuclari'});

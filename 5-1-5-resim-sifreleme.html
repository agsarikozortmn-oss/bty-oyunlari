<html lang="tr">

<title>Gizli Resim: Resim Şifreleme</title>

<style>

h1,h2,h3{font-family:var(--f-baslik);margin:0;line-height:1.15}
.kap{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.ust{background:linear-gradient(90deg,#1E3A8A,#7C3AED 60%,#DB2777);color:#fff;border-radius:16px;padding:8px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;box-shadow:0 4px 14px rgba(124,58,237,.3)}
.ust h1{font-size:clamp(24px,2.8vw,36px);flex:1 1 280px}
.skor{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cip{border-radius:12px;padding:4px 16px;font-family:var(--f-baslik);font-size:clamp(20px,2vw,28px);background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.35);font-variant-numeric:tabular-nums}
.cip.a.sira{background:var(--turuncu);border-color:#fff}.cip.b.sira{background:var(--mor);border-color:#fff}
.kdugme{font:inherit;font-weight:800;font-size:16px;border:2px solid rgba(255,255,255,.45);background:transparent;color:#fff;border-radius:10px;padding:5px 12px;cursor:pointer}
.kutu{background:#fff;border-radius:24px;border:5px solid #C4B5FD;padding:20px 24px;box-shadow:0 4px 16px rgba(30,58,138,.1)}
.dugme{font-family:var(--f-baslik);font-weight:800;font-size:clamp(22px,2.1vw,30px);border:0;border-radius:16px;padding:12px 28px;cursor:pointer;background:var(--turuncu);color:#fff;box-shadow:0 5px 0 #9A3412}
.dugme:active{transform:translateY(2px);box-shadow:0 2px 0 #9A3412}
.dugme.lac{background:var(--lacivert);box-shadow:0 5px 0 #172554}.dugme.yes{background:var(--yesil);box-shadow:0 5px 0 #14532D}
.dugme.mor{background:var(--mor);box-shadow:0 5px 0 #4C1D95}.dugme.kir{background:var(--kirmizi);box-shadow:0 5px 0 #7F1D1D}.dugme.gri{background:#64748B;box-shadow:0 5px 0 #334155}

button:focus-visible{outline:5px solid var(--turuncu);outline-offset:3px}
.ekran{background:#fff;border:5px solid #C4B5FD;border-radius:26px;padding:24px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.ekran h2{font-size:clamp(32px,4.2vw,56px);color:var(--lacivert)}
.ekran p{margin:0;font-size:clamp(20px,2vw,26px);max-width:920px}
.etiket-s{font-weight:800;color:var(--soluk);font-size:18px;letter-spacing:.06em;text-transform:uppercase}

.secim button{font:inherit;font-weight:800;font-size:21px;padding:10px 18px;border-radius:14px;border:3px solid var(--cizgi);background:#fff;color:var(--metin);cursor:pointer;min-width:160px}

.cevap{background:var(--yesil-z);border:4px solid var(--yesil);border-radius:16px;padding:12px 18px;font-size:clamp(24px,2.6vw,36px);font-weight:800;color:#14532D;animation:gel .35s ease-out}

@keyframes gel{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes salla{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.salla{animation:salla .4s}
.buyuk-ikon{font-size:72px;line-height:1}
.not{font-size:18px;color:var(--soluk)}
.hazirlayan{font-size:14px;color:#64748B;margin:4px 0 0}.hazirlayan b{color:#1E3A8A}

.seviyeler{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;width:100%}
.seviyeler button{font:inherit;border:0;border-radius:22px;padding:18px;color:#fff;cursor:pointer;font-weight:800;font-size:20px;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.seviyeler b{display:block;font-family:var(--f-baslik);font-size:36px}
.kural{background:var(--sari-z);border:4px solid var(--sari);border-radius:18px;padding:12px 18px;font-size:clamp(19px,1.9vw,25px);font-weight:700;text-align:left;max-width:1000px}
.galeri{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;width:100%}

.galeri button:hover{border-color:var(--mor)}
.galeri .bitti{border-color:var(--yesil)}
.galeri .soru{width:90px;height:90px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-baslik);font-size:60px;color:#fff}
.galeri canvas{width:90px;height:90px;image-rendering:pixelated;border-radius:8px;border:2px solid var(--cizgi)}
.tur{font-size:15px;border-radius:999px;padding:2px 12px;color:#fff}
.alan{display:flex;gap:18px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.tablo{display:grid;gap:3px;background:#fff;border:6px solid #C4B5FD;border-radius:20px;padding:10px;touch-action:none;user-select:none}
.no,.kod{display:flex;align-items:center;font-family:var(--f-baslik);font-weight:800;color:var(--lacivert);line-height:1}
.no{justify-content:center;color:var(--soluk)}
.kod{padding:0 10px;border-radius:10px;background:#F1F5F9;white-space:nowrap;letter-spacing:.02em}
.kod.ok{background:var(--yesil-z);color:#15803D}
.kod.hata{background:var(--kirmizi-z);color:#B91C1C}
.kare{background:#fff;border:2px solid #CBD5E1;border-radius:4px;cursor:pointer}
.kare.dolu{border-color:transparent}
.tablo.salt .kare{cursor:default}
.kod input{font:inherit;width:100%;border:0;background:transparent;color:inherit;outline:none;letter-spacing:.04em}
.kod input::placeholder{color:#94A3B8}
.yan{display:flex;flex-direction:column;gap:12px;max-width:330px}
.yan h2{margin:0;font-family:var(--f-baslik);font-size:34px;color:var(--lacivert)}
.ipucu{background:var(--sari-z);border:4px solid var(--sari);border-radius:16px;padding:10px 14px;font-weight:700;font-size:clamp(17px,1.6vw,21px)}
.yan .dugme{font-size:20px;padding:10px 16px}
.tamam{background:var(--yesil-z);border:4px solid var(--yesil);border-radius:16px;padding:12px 14px;font-weight:800;font-size:clamp(20px,2vw,26px);animation:gel .3s}
.tamam b{display:block;font-family:var(--f-baslik);font-size:1.5em;color:#15803D}
</style>
</head>

</div>

    $$('.kare',t).forEach(c=>{c.style.borderColor=c.classList.contains('dolu')?S.renk:'#fff';c.style.borderRadius='0'});t.style.gap='0';
    yan.innerHTML='';yan.append(el('div',{class:'tamam'},el('b',{},'Buldun: '+r.ad+'!'),`Bu resim ${n*n} kareden oluşuyor ama kodu çok daha kısa. Bilgisayarlar da resimleri böyle küçültür.`),sonrakiDugmeler(si,ri));}}
function sifrele(si,ri){const{S,r,n,t,fs}=kur(si,ri,true);D={si,ri};skorCiz();sahne.innerHTML='';const girdiler=[],kodlar=[];
  for(let y=0;y<n;y++){t.append(el('div',{class:'no',style:`font-size:${fs*.8}px`},String(y+1)));

<style>
/* Seçimli hikâye: akıllı tahtada sınıfça oynanır. Büyük yazı, renkli tasarım; bilinçli olarak tek (açık) tema. */
:root{color-scheme:light;--lacivert:#1E3A8A;--turuncu:#EA580C;--yesil:#16A34A;--yesil-z:#DCFCE7;--kirmizi:#DC2626;--kirmizi-z:#FEE2E2;--sari:#CA8A04;--sari-z:#FEF9C3;--mor:#7C3AED;
  --metin:#1E293B;--soluk:#64748B;--cizgi:#CBD5E1;--f-baslik:"Baloo 2","Trebuchet MS",system-ui,sans-serif;--f-govde:"Nunito","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--metin);font-family:var(--f-govde);font-size:20px;padding:10px;-webkit-user-select:none;user-select:none;
  background:radial-gradient(circle at 6% 10%,#FDE68A 0 110px,transparent 111px),radial-gradient(circle at 94% 92%,#FBCFE8 0 150px,transparent 151px),radial-gradient(circle at 96% 8%,#BFDBFE 0 80px,transparent 81px),radial-gradient(circle at 4% 94%,#BBF7D0 0 100px,transparent 101px),linear-gradient(135deg,#EEF2FF,#FDF4FF 55%,#ECFEFF)}
h1,h2{font-family:var(--f-baslik);margin:0;line-height:1.15}
.kap{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.ust{background:linear-gradient(90deg,#1E3A8A,#7C3AED 60%,#DB2777);color:#fff;border-radius:16px;padding:8px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;box-shadow:0 4px 14px rgba(124,58,237,.3)}
.ust h1{font-size:clamp(24px,2.8vw,36px);flex:1 1 280px}
.olcer{display:flex;align-items:center;gap:10px;font-family:var(--f-baslik);font-size:clamp(18px,1.8vw,24px);min-width:250px}
.olcer .bar{flex:1;height:22px;background:rgba(255,255,255,.25);border-radius:999px;overflow:hidden;border:2px solid rgba(255,255,255,.5);min-width:120px}
.olcer .dol{height:100%;border-radius:999px;transition:width .7s ease,background .7s}
.olcer svg{width:30px;height:30px;flex:none}
.sahne{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px;align-items:stretch}
.sol{background:#fff;border-radius:24px;border:5px solid #C4B5FD;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;box-shadow:0 4px 16px rgba(30,58,138,.1)}
.avatar{width:min(220px,24vh);height:min(220px,24vh)}
.resim{max-width:100%;max-height:28vh;border-radius:14px}
.ad{font-family:var(--f-baslik);font-size:clamp(26px,2.6vw,36px);color:var(--lacivert)}
.sag{background:#fff;border-radius:24px;border:5px solid #C4B5FD;padding:18px 24px;display:flex;flex-direction:column;gap:12px;justify-content:center;box-shadow:0 4px 16px rgba(30,58,138,.1)}
.zaman{align-self:flex-start;background:var(--mor);color:#fff;border-radius:999px;padding:6px 20px;font-weight:800;font-size:clamp(18px,1.8vw,24px)}
.durum{font-family:var(--f-baslik);font-size:clamp(26px,2.9vw,42px);font-weight:700;color:var(--lacivert);line-height:1.25}
.soru{font-weight:800;font-size:clamp(20px,2vw,28px);color:var(--turuncu)}
.secenekler{display:flex;flex-direction:column;gap:12px}
.secenek{font:inherit;text-align:left;font-weight:800;font-size:clamp(21px,2.1vw,30px);padding:14px 18px;border-radius:18px;border:4px solid;background:#fff;cursor:pointer;display:flex;gap:14px;align-items:center;transition:transform .12s}
.secenek:hover{transform:translateX(6px)}
.secenek b{display:grid;place-items:center;min-width:50px;height:50px;border-radius:50%;color:#fff;font-family:var(--f-baslik);flex:none}
.secenek:focus-visible,.dugme:focus-visible{outline:5px solid var(--turuncu);outline-offset:3px}
.sonuc{border-radius:20px;padding:14px 20px;border:5px solid;display:flex;flex-direction:column;gap:8px;animation:gel .4s ease-out}
.sonuc.iyi{background:var(--yesil-z);border-color:var(--yesil)}.sonuc.orta{background:var(--sari-z);border-color:var(--sari)}.sonuc.kotu{background:var(--kirmizi-z);border-color:var(--kirmizi)}
.sonuc h2{font-size:clamp(28px,3vw,44px)}
.sonuc.iyi h2{color:#14532D}.sonuc.orta h2{color:#854D0E}.sonuc.kotu h2{color:#7F1D1D}
.sonuc p{margin:0;font-size:clamp(21px,2.1vw,30px);font-weight:700;line-height:1.3}
.bilgi{background:rgba(255,255,255,.75);border-radius:14px;padding:10px 14px;font-size:clamp(18px,1.8vw,24px)!important;font-weight:600!important}
.degisim{display:flex;gap:10px;flex-wrap:wrap}
.degisim span{border-radius:999px;padding:4px 14px;font-weight:800;font-size:clamp(18px,1.8vw,24px);color:#fff}
@keyframes gel{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.dugme{font-family:var(--f-baslik);font-weight:800;font-size:clamp(22px,2.2vw,30px);border:0;border-radius:16px;padding:12px 30px;cursor:pointer;background:var(--turuncu);color:#fff;box-shadow:0 5px 0 #9A3412;align-self:flex-start}

.dugme.lac{background:var(--lacivert);box-shadow:0 5px 0 #172554}
.ilerleme{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.ilerleme i{width:22px;height:22px;border-radius:50%;background:#E2E8F0;border:3px solid #fff;box-shadow:0 0 0 2px #C4B5FD}
.ilerleme i.iyi{background:var(--yesil)}.ilerleme i.orta{background:#FACC15}.ilerleme i.kotu{background:var(--kirmizi)}.ilerleme i.simdi{background:var(--mor)}
.ekran{background:#fff;border:5px solid #C4B5FD;border-radius:26px;padding:24px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.ekran h2{font-size:clamp(32px,4.2vw,56px);color:var(--lacivert)}
.ekran p{margin:0;font-size:clamp(20px,2vw,26px);max-width:900px}
.rozet-buyuk{font-family:var(--f-baslik);font-size:clamp(26px,3vw,40px);color:#fff;border-radius:22px;padding:12px 30px}
.ozet{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;width:100%;text-align:left}
.ozet div{border-radius:14px;padding:10px 14px;font-weight:700;font-size:19px;border:3px solid}
.ozet .iyi{border-color:var(--yesil);background:var(--yesil-z)}.ozet .orta{border-color:var(--sari);background:var(--sari-z)}.ozet .kotu{border-color:var(--kirmizi);background:var(--kirmizi-z)}
.hazirlayan{font-size:14px;color:#64748B;margin:4px 0 0}.hazirlayan b{color:#1E3A8A}
@media (max-width:860px){.sahne{grid-template-columns:1fr}.sol{flex-direction:row;padding:10px}.avatar{width:120px;height:120px}.resim{max-height:120px;max-width:45%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const el=(t,o={},...c)=>{const e=document.createElement(t);Object.entries(o).forEach(([k,v])=>k==='class'?e.className=v:k==='html'?e.innerHTML=v:k.startsWith('on')?e[k]=v:e.setAttribute(k,v));c.flat().forEach(x=>x!=null&&e.append(x));return e};
const md=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
let D=null;

function avatar(ruh){ // ruh: 1 mutlu, 0 normal, -1 üzgün
  const k=OYUN.karakter, agiz=ruh>0?'M78 132 Q100 156 122 132':ruh<0?'M80 144 Q100 124 120 144':'M82 138 L118 138';
  const kas=ruh<0?'<path d="M70 92 L90 98 M130 92 L110 98" stroke="#1E293B" stroke-width="5" stroke-linecap="round"/>':'';
  const yanak=ruh>0?'<circle cx="64" cy="122" r="10" fill="#FCA5A5" opacity=".7"/><circle cx="136" cy="122" r="10" fill="#FCA5A5" opacity=".7"/>':'';
  const sac=k.uzunSac?`<path d="M38 104 C34 40 166 40 162 104 L166 170 C150 176 146 150 148 120 C150 80 50 80 52 120 C54 150 50 176 34 170 Z" fill="${k.sac}"/>`:`<path d="M44 98 C40 40 160 40 156 98 C150 70 50 70 44 98 Z" fill="${k.sac}"/>`;
  return `<svg class="avatar" viewBox="0 0 200 220" aria-hidden="true"><circle cx="100" cy="110" r="96" fill="${k.zemin}"/>
    <path d="M30 220 C34 172 166 172 170 220 Z" fill="${k.giysi}"/>${sac}
    <ellipse cx="100" cy="112" rx="56" ry="60" fill="#F5C9A0"/>${`<path d="M42 104 C36 30 164 30 158 104 C146 84 120 78 100 78 C80 78 54 84 42 104 Z" fill="${k.sac}"/>`}

    ${yanak}<path d="${agiz}" stroke="#1E293B" stroke-width="6" fill="none" stroke-linecap="round"/></svg>`;}
function ikon(i){return i===0?'<svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z" fill="#fff"/></svg>'

function olcerCiz(){const k=$('#olcerler');k.innerHTML='';if(!D)return;
  OYUN.olcer.forEach((o,i)=>{const v=D.puan[i],r=v>=65?'#4ADE80':v>=40?'#FACC15':'#F87171';
    k.append(el('div',{class:'olcer'},el('span',{html:ikon(o.ikon)}),el('span',{},o.ad),el('div',{class:'bar'},el('div',{class:'dol',style:`width:${v}%;background:${r}`}))));});}
function ruh(){if(!D)return 1;const o=(D.puan[0]+D.puan[1])/2;return o>=60?1:o>=40?0:-1;}

function giris(){D=null;olcerCiz();sahne.innerHTML='';
  sahne.append(el('section',{class:'ekran'},el('div',{html:avatar(1)}),el('h2',{},OYUN.baslik),el('p',{html:md(OYUN.giris)}),
    el('p',{html:md('Her durumda **sınıfça tartışın**, sonra bir seçenek seçin. Bakalım '+OYUN.karakter.ad+' günü nasıl geçirecek?')}),
    el('button',{class:'dugme',onclick:basla},'Hikâyeyi başlat'),
    el('p',{class:'hazirlayan'},el('b',{},'Hazırlayan: Ayşegül SARIKOZ (BTY Dersi Öğretmeni)'),' · Türkkonut Ortaokulu')));}
function basla(){D={i:0,puan:OYUN.olcer.map(()=>60),secimler:[]};olcerCiz();sahneCiz();}

function ilerleme(){return el('div',{class:'ilerleme'},OYUN.sahneler.map((_,k)=>el('i',{class:k<D.secimler.length?D.secimler[k].tur:(k===D.i?'simdi':'')})));}
function sahneCiz(){const s=OYUN.sahneler[D.i];sahne.innerHTML='';
  const sol=el('section',{class:'sol'},el('div',{html:avatar(ruh())}),el('div',{class:'ad'},OYUN.karakter.ad));
  if(s.resim&&RESIM[s.resim])sol.append(el('img',{class:'resim',src:RESIM[s.resim],alt:''}));
  sol.append(ilerleme());
  const sag=el('section',{class:'sag','aria-live':'polite'},el('span',{class:'zaman'},`${D.i+1}/${OYUN.sahneler.length} · ${s.zaman}`),el('div',{class:'durum',html:md(s.durum)}),el('div',{class:'soru'},s.soru||OYUN.karakter.ad+' ne yapmalı?'));

    const deg=o.d||(tur==='iyi'?[15,15]:tur==='orta'?[-5,0]:[-20,-15]);
    D.puan=D.puan.map((v,i)=>Math.max(0,Math.min(100,v+(deg[i]||0))));olcerCiz();
    sol.firstChild.innerHTML=avatar(ruh());sol.querySelector('.ilerleme').replaceWith(ilerleme());
    sec.replaceWith(el('div',{class:'sonuc '+tur},
      el('h2',{},tur==='iyi'?'Harika seçim!':tur==='orta'?'Hmm, daha iyisi olabilirdi':'Eyvah!'),
      el('p',{html:md(o.sonuc)}),o.bilgi?el('p',{class:'bilgi',html:'<strong>Biliyor muydun?</strong> '+md(o.bilgi)}):null,
      el('div',{class:'degisim'},OYUN.olcer.map((ol,i)=>deg[i]?el('span',{style:`background:${deg[i]>0?'#16A34A':'#DC2626'}`},`${deg[i]>0?'+':''}${deg[i]} ${ol.ad}`):null)),
      el('button',{class:'dugme lac',onclick:()=>{D.i++;D.i<OYUN.sahneler.length?sahneCiz():son()}},D.i+1<OYUN.sahneler.length?'Devam et →':'Sonucu gör')));
    sag.querySelector('.soru').remove();}}

function son(){const iyi=D.secimler.filter(x=>x.tur==='iyi').length,n=D.secimler.length,o=(D.puan[0]+D.puan[1])/2;
  const r=o>=75?OYUN.rozetler[0]:o>=50?OYUN.rozetler[1]:OYUN.rozetler[2];sahne.innerHTML='';
  sahne.append(el('section',{class:'ekran'},el('div',{html:avatar(o>=50?1:o>=35?0:-1)}),el('h2',{},r.baslik),
    el('div',{class:'rozet-buyuk',style:`background:${r.renk}`},r.rozet),el('p',{html:md(`${n} kararın **${iyi}** tanesi en doğru seçimdi. ${r.mesaj}`)}),
    el('div',{class:'ozet'},D.secimler.map(x=>el('div',{class:x.tur},(x.tur==='iyi'?'✓ ':x.tur==='orta'?'~ ':'✗ ')+x.sahne+': ',el('span',{html:md(x.t)})))),
    el('button',{class:'dugme',onclick:giris},'Baştan oyna'),
    el('p',{class:'hazirlayan'},el('b',{},'Hazırlayan: Ayşegül SARIKOZ (BTY Dersi Öğretmeni)'),' · Türkkonut Ortaokulu')));}
giris();

<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kutu Aç</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{color-scheme:light;--lacivert:#1E3A8A;--turuncu:#EA580C;--mavi:#2563EB;--mavi-z:#DBEAFE;--yesil:#16A34A;--yesil-z:#DCFCE7;--kirmizi:#DC2626;--kirmizi-z:#FEE2E2;--mor:#7C3AED;--mor-z:#EDE9FE;--sari:#CA8A04;--sari-z:#FEF9C3;--pembe:#DB2777;--camgob:#0E7490;
  --metin:#1E293B;--soluk:#64748B;--cizgi:#CBD5E1;--f-baslik:"Baloo 2","Trebuchet MS",system-ui,sans-serif;--f-govde:"Nunito","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--metin);font-family:var(--f-govde);font-size:20px;padding:10px;-webkit-user-select:none;user-select:none;
  background:radial-gradient(circle at 6% 10%,#FDE68A 0 110px,transparent 111px),radial-gradient(circle at 94% 92%,#FBCFE8 0 150px,transparent 151px),radial-gradient(circle at 96% 8%,#BFDBFE 0 80px,transparent 81px),radial-gradient(circle at 4% 94%,#BBF7D0 0 100px,transparent 101px),linear-gradient(135deg,#EEF2FF,#FDF4FF 55%,#ECFEFF)}
h1,h2,h3{font-family:var(--f-baslik);margin:0;line-height:1.15}
.kap{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.ust{background:linear-gradient(90deg,#1E3A8A,#7C3AED 60%,#DB2777);color:#fff;border-radius:16px;padding:8px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;box-shadow:0 4px 14px rgba(124,58,237,.3)}
.ust h1{font-size:clamp(24px,2.8vw,36px);flex:1 1 280px}
.skor{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cip{border-radius:12px;padding:4px 16px;font-family:var(--f-baslik);font-size:clamp(20px,2vw,28px);background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.35);font-variant-numeric:tabular-nums}
.cip.a.sira{background:var(--turuncu);border-color:#fff}.cip.b.sira{background:var(--mor);border-color:#fff}
.kdugme{font:inherit;font-weight:800;font-size:16px;border:2px solid rgba(255,255,255,.45);background:transparent;color:#fff;border-radius:10px;padding:5px 12px;cursor:pointer}
.kutu{background:#fff;border-radius:24px;border:5px solid #C4B5FD;padding:20px 24px;box-shadow:0 4px 16px rgba(30,58,138,.1)}
.dugme{font-family:var(--f-baslik);font-weight:800;font-size:clamp(22px,2.1vw,30px);border:0;border-radius:16px;padding:12px 28px;cursor:pointer;background:var(--turuncu);color:#fff;box-shadow:0 5px 0 #9A3412}
.dugme:active{transform:translateY(2px);box-shadow:0 2px 0 #9A3412}
.dugme.lac{background:var(--lacivert);box-shadow:0 5px 0 #172554}.dugme.yes{background:var(--yesil);box-shadow:0 5px 0 #14532D}
.dugme.mor{background:var(--mor);box-shadow:0 5px 0 #4C1D95}.dugme.kir{background:var(--kirmizi);box-shadow:0 5px 0 #7F1D1D}.dugme.gri{background:#64748B;box-shadow:0 5px 0 #334155}
.dugme:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:5px solid var(--turuncu);outline-offset:3px}
.ekran{background:#fff;border:5px solid #C4B5FD;border-radius:26px;padding:24px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.ekran h2{font-size:clamp(32px,4.2vw,56px);color:var(--lacivert)}
.ekran p{margin:0;font-size:clamp(20px,2vw,26px);max-width:920px}
.etiket-s{font-weight:800;color:var(--soluk);font-size:18px;letter-spacing:.06em;text-transform:uppercase}
.secim{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.secim button{font:inherit;font-weight:800;font-size:21px;padding:10px 18px;border-radius:14px;border:3px solid var(--cizgi);background:#fff;color:var(--metin);cursor:pointer;min-width:160px}
.secim button[aria-pressed="true"]{border-color:var(--turuncu);background:#FFEDD5;color:#9A3412}
.secim small{display:block;font-weight:600;color:var(--soluk);font-size:15px}
.cevap{background:var(--yesil-z);border:4px solid var(--yesil);border-radius:16px;padding:12px 18px;font-size:clamp(24px,2.6vw,36px);font-weight:800;color:#14532D;animation:gel .35s ease-out}
.yanlis-k{background:var(--kirmizi-z);border:4px solid var(--kirmizi);border-radius:16px;padding:12px 18px;font-size:clamp(22px,2.3vw,32px);font-weight:800;color:#7F1D1D;animation:gel .35s ease-out}
@keyframes gel{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes salla{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.salla{animation:salla .4s}
.buyuk-ikon{font-size:72px;line-height:1}
.not{font-size:18px;color:var(--soluk)}
.hazirlayan{font-size:14px;color:#64748B;margin:4px 0 0}.hazirlayan b{color:#1E3A8A}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.kutular{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;height:calc(100vh - 110px)}
.hediye{font:inherit;border:0;border-radius:22px;cursor:pointer;color:#fff;font-family:var(--f-baslik);font-size:clamp(44px,5.5vw,84px);font-weight:800;position:relative;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.22);transition:transform .15s}
.hediye:hover:not(:disabled){transform:translateY(-4px) rotate(-1deg)}
.hediye::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:16%;transform:translateX(-50%);background:rgba(255,255,255,.28)}
.hediye::after{content:"";position:absolute;top:22%;left:0;right:0;height:14%;background:rgba(255,255,255,.28)}
.hediye span{position:relative;z-index:1;text-shadow:0 3px 0 rgba(0,0,0,.2)}
.hediye:disabled{background:#E2E8F0!important;color:#94A3B8;box-shadow:none;cursor:default}
.hediye:disabled::before,.hediye:disabled::after{display:none}
.hediye .kim{position:absolute;bottom:8px;left:0;right:0;font-size:16px;font-family:var(--f-govde)}
.acik-kutu{display:flex;flex-direction:column;gap:16px;justify-content:center;min-height:calc(100vh - 110px);animation:gel .35s}
.acik-kutu .bas{display:flex;align-items:center;gap:14px}
.no{display:grid;place-items:center;width:90px;height:90px;border-radius:22px;color:#fff;font-family:var(--f-baslik);font-size:52px;flex:none}
.soru{font-family:var(--f-baslik);font-size:clamp(32px,3.8vw,58px);font-weight:700;color:var(--lacivert);line-height:1.22}
.secenekler{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.secenekler div{border:4px solid var(--cizgi);border-radius:18px;padding:12px 16px;font-weight:800;font-size:clamp(24px,2.5vw,36px);display:flex;gap:12px;align-items:center;background:#F8FAFC}
.secenekler b{display:grid;place-items:center;min-width:52px;height:52px;border-radius:50%;background:var(--lacivert);color:#fff;font-family:var(--f-baslik)}
.secenekler div.dogru{border-color:var(--yesil);background:var(--yesil-z)}.secenekler div.dogru b{background:var(--yesil)}
.surpriz{font-family:var(--f-baslik);font-size:clamp(44px,5.5vw,84px);text-align:center;color:var(--mor)}
.dugmeler{display:flex;gap:12px;flex-wrap:wrap}
@media (max-width:900px){.kutular{grid-template-columns:repeat(4,1fr);height:auto}.hediye{min-height:110px}.secenekler{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="kap">
  <header class="ust"><h1 id="baslik"></h1><div class="skor" id="skor"></div><span id="sesyer"></span></header>
  <main id="sahne"></main>
</div>
<script>

let SES=true,AC=null;

const dogruSes=()=>{bip(784,.12);setTimeout(()=>bip(1047,.2),110)}, yanlisSes=()=>{bip(220,.25,'sawtooth')};
const IMZA=()=>el('p',{class:'hazirlayan'},el('b',{},'Hazırlayan: Ayşegül SARIKOZ (BTY Dersi Öğretmeni)'),' · Türkkonut Ortaokulu');
function sesDugmesi(){const b=el('button',{class:'kdugme','aria-pressed':'true'},'Ses: açık');b.onclick=()=>{SES=!SES;b.textContent='Ses: '+(SES?'açık':'kapalı');b.setAttribute('aria-pressed',String(SES))};return b}
function secimGrubu(secenekler,deger,degis){const g=el('div',{class:'secim'});const yen=()=>g.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===String(deger()))));
  secenekler.forEach(([v,ad,alt])=>g.append(el('button',{'data-v':v,onclick:()=>{degis(v);yen()}},ad,alt?el('small',{},alt):null)));yen();return g}

const OYUN={baslik:'Kutu Aç · Bilişim Teknolojileri',giris:'Bir kutu seç, içinden çıkan soruyu cevapla! Sorular **Bilişim Teknolojilerinin Sınıflandırılması** konusundan.',
sorular:[
{s:'Tek başına anlam taşımayan ham sayı ve harflere ne denir?',a:'Veri'},
{s:'Verinin anlam kazanmış hâline ne denir?',a:'Bilgi'},
{s:'Hangisi bir donanımdır?',c:['Klavye','İşletim sistemi','Oyun','Web tarayıcısı'],a:0},
{s:'Hangisi bir yazılımdır?',c:['Fare','Ekran','Resim programı','Kasa'],a:2},
{s:'Donanım ve yazılımı piyanoya benzetirsek nota kâğıdı hangisi olur?',a:'Yazılım (piyanonun kendisi donanım)'},
{s:'BİT kısaltmasının açılımı nedir?',a:'Bilgi ve İletişim Teknolojileri'},
{s:'Her iletişimde bulunan üç öğe nedir?',a:'Gönderen, ileti ve alıcı'},
{s:'Arılar birbirine çiçeklerin yerini nasıl anlatır?',a:'Özel bir dansla'},
{s:'Telgrafın günümüzdeki karşılığı nedir?',a:'Anlık mesajlaşma uygulamaları ve e-posta'},
{s:'Teypin (kasetçaların) günümüzdeki karşılığı nedir?',a:'Çevrim içi müzik platformları'},
{s:'Yaygın bir disket kaç MB veri alırdı?',c:['1,44 MB','100 MB','1 GB','1 TB'],a:0},
{s:'İlk bilgisayarlardan ENIAC yaklaşık kaç ton ağırlığındaydı?',c:['27 ton','2 kilogram','100 gram','1 ton'],a:0},
{s:'Bilişim teknolojilerinin dört avantajı nedir?',a:'Kolaylık, hız, tasarruf, verimlilik'},
{s:'Yeşil ekranda arka plan neden yeşil seçilir?',a:'Yeşil, insan teninde, saçında ve gözlerinde çok az bulunur.'},
{s:'Yeşil ekran önünde yeşil kıyafet giyen oyuncuya ne olur?',a:'Kıyafeti de silinir, görünmez olur!'},
{s:'MR cihazı hangi kullanım alanına örnektir?',c:['Sağlık','Ulaşım','Eğlence','Bankacılık'],a:0},
{s:'HGS (Hızlı Geçiş Sistemi) hangi alana örnektir?',c:['Eğitim','Ulaşım','Sağlık','Güvenlik'],a:1},
{s:'EBA hangi kullanım alanına örnektir?',a:'Eğitim'},
{s:'Uydular ve teleskoplar hangi kullanım alanına örnektir?',a:'Bilim ve uzay'},
{s:'Akıllı telefon neden birden fazla gruba girer?',a:'İletişim, eğitim, bankacılık ve eğlence gibi farklı amaçlarla kullanılır.'},
{s:'Türkçeye uygun F klavye hangi yıl kabul edildi?',c:['1955','2005','1900','1990'],a:0}]}
;
document.title=OYUN.baslik;$('#baslik').textContent=OYUN.baslik;$('#sesyer').append(sesDugmesi());
const sahne=$('#sahne'),RENK=['#EA580C','#2563EB','#16A34A','#7C3AED','#DB2777','#0E7490'],TAKIM=['Turuncu takım','Mor takım'];
const ayar={mod:'takim'};let D=null;
const SURPRIZ=[{t:'Şanslı kutu!',a:'+10 puan kazandınız!',p:10},{t:'Şanslı kutu!',a:'+10 puan kazandınız!',p:10},{t:'Pas kutusu',a:'Bu tur soru yok. Sıra diğer takıma geçiyor.',p:0},{t:'Süper kutu!',a:'+20 puan kazandınız!',p:20}];

function skorCiz(){const k=$('#skor');k.innerHTML='';if(!D)return;
  if(D.mod==='takim')[0,1].forEach(i=>k.append(el('span',{class:'cip '+(i?'b':'a')+(D.sira===i?' sira':'')},`${TAKIM[i]}: ${D.puan[i]}`)));
  else k.append(el('span',{class:'cip'},'Doğru: '+D.puan[0]),el('span',{class:'cip'},'Kalan kutu: '+D.kutular.filter(x=>!x.acik).length));
  k.append(el('button',{class:'kdugme',onclick:bitir},'Oyunu bitir'));}
function giris(){D=null;skorCiz();sahne.innerHTML='';
  sahne.append(el('section',{class:'ekran'},el('h2',{},OYUN.baslik),el('p',{html:md(OYUN.giris)}),
    el('p',{html:md('Kutuların bazılarında **sürpriz** var: şanslı kutu, süper kutu, pas kutusu!')}),
    el('div',{class:'etiket-s'},'Nasıl oynayalım?'),secimGrubu([['takim','İki takım','Sırayla kutu açın'],['tek','Tüm sınıf','Birlikte açın']],()=>ayar.mod,v=>ayar.mod=v),
    el('button',{class:'dugme',onclick:basla},'Oyuna başla'),IMZA()));}
function basla(){const n=24-SURPRIZ.length;const q=karistir(OYUN.sorular).slice(0,n).map(x=>({q:x}));
  D={mod:ayar.mod,kutular:karistir([...q,...SURPRIZ.map(s=>({s}))]).map(x=>({...x,acik:false})),puan:[0,0],sira:0};skorCiz();izgara();}
function izgara(){sahne.innerHTML='';const g=el('div',{class:'kutular'});
  D.kutular.forEach((k,i)=>g.append(el('button',{class:'hediye',style:`background:${RENK[(i+Math.floor(i/6)*2)%6]}`,disabled:k.acik?'':null,onclick:()=>ac(i)},el('span',{},String(i+1)))));sahne.append(g);
  if(D.kutular.every(k=>k.acik))setTimeout(bitir,400);}
function ac(i){const k=D.kutular[i];k.acik=true;bip(660,.08);setTimeout(()=>bip(880,.12),90);sahne.innerHTML='';
  const rk=RENK[(i+Math.floor(i/6)*2)%6];const kutu=el('section',{class:'kutu acik-kutu',style:`border-color:${rk}`});const bas=el('div',{class:'bas'},el('div',{class:'no',style:`background:${rk}`},String(i+1)));kutu.append(bas);
  const devam=()=>{if(D.mod==='takim')D.sira=1-D.sira;skorCiz();izgara()};
  if(k.s){bas.append(el('div',{class:'surpriz'},k.s.t));kutu.append(el('div',{class:'cevap',style:'text-align:center'},k.s.a));
    if(k.s.p){D.puan[D.mod==='takim'?D.sira:0]+=D.mod==='takim'?k.s.p:0;dogruSes()}skorCiz();kutu.append(el('button',{class:'dugme lac',style:'align-self:center',onclick:devam},'Kutulara dön'));sahne.append(kutu);return;}
  const q=k.q;bas.append(el('div',{class:'soru'},q.s));let sec=null;
  if(q.c){sec=el('div',{class:'secenekler'},q.c.map((x,j)=>el('div',{},el('b',{},'ABCD'[j]),x)));kutu.append(sec);}
  const alt=el('div',{class:'dugmeler'},el('button',{class:'dugme lac',onclick:goster},'Cevabı göster'));kutu.append(alt);sahne.append(kutu);
  function goster(){alt.remove();bip(784,.15);if(q.c){sec.children[q.a].classList.add('dogru');kutu.append(el('div',{class:'cevap'},'Doğru cevap: '+'ABCD'[q.a]+') '+q.c[q.a]))}else kutu.append(el('div',{class:'cevap'},q.a));
    const o=D.sira;kutu.append(D.mod==='takim'?el('div',{class:'dugmeler'},el('button',{class:'dugme '+(o?'mor':''),onclick:()=>{D.puan[o]+=10;dogruSes();devam()}},`${TAKIM[o]} bildi +10`),el('button',{class:'dugme '+(o?'':'mor'),onclick:()=>{D.puan[1-o]+=5;dogruSes();devam()}},`${TAKIM[1-o]} bildi +5`),el('button',{class:'dugme gri',onclick:devam},'Bilen olmadı'))

  else p.append(el('h2',{},'Tebrikler sınıf!'),el('p',{},`${D.puan[0]} soruyu doğru bildiniz.`));
  p.append(el('button',{class:'dugme',onclick:giris},'Yeni oyun'),IMZA());D=null;skorCiz();sahne.innerHTML='';sahne.append(p);}
giris();
</script>
</body>
</html>
